name: Verify Firestore access

# Manual only. This never runs on a schedule and never touches docs/ or the
# brief. Actions -> Verify Firestore access -> Run workflow.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check the service account can read Firestore
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: node scripts/verify-firestore.mjs

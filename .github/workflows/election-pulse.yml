name: Election pulse (val2026)

# Election day only: every 30 minutes from noon to 23:00 Swedish time on
# 13 September. After that the sphere goes back to being an ordinary nightly
# sphere carried by the Morgonbrief workflow alongside congress, crypto and
# world. The two never overlap - this window ends at 23:00, the nightly run
# fires at 02:00 - so there is no duplicate risk and nothing to switch over.
#
# Separate from the daily workflow for two reasons. run.mjs has no sphere flag
# and exits non-zero when nothing is produced, which is right for a daily brief
# and wrong for a pulse. And a 30-minute cadence must never be able to wedge
# the daily brief.

on:
  schedule:
    # 12:00 through 23:30 on 13 September. The runner enforces the real window
    # itself and exits cleanly after 23:00, so the trailing 23:30 slot is a
    # no-op rather than an unwanted run.
    #
    # Actions honours schedules loosely - runs are delayed under load and are
    # sometimes skipped entirely. The runner never assumes even spacing: it
    # sweeps a generous window and dedupes by link hash in the ledger.
    - cron: '*/30 12-23 13 9 *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

concurrency:
  # A delayed run must never overlap its successor. Overlap would double-count
  # circulation and manufacture a pattern out of scheduler jitter rather than
  # out of what the press actually did.
  group: election-pulse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot rebase, and this pushes to the same branch
          # every 30 minutes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Run pulse
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run pulse

      - name: Commit
        run: |
          git config user.name  "morgonbrief"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.json docs/val-ledger.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "val2026 pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

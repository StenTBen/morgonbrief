name: Election pulse (val2026)

# Every 30 minutes from 21:00 on 12 September to 23:00 on 13 September, Swedish
# time. After that the sphere goes back to being an ordinary nightly sphere
# carried by the Morgonbrief workflow alongside congress, crypto and world.
#
# The nightly run at 02:00 falls INSIDE this window and rewrites docs/feed.json
# wholesale. The pulse therefore replays every entry it has published on each
# run, so the 02:30 pulse restores whatever 02:00 removed. That is why the
# nightly workflow needs no change.
#
# Separate from the daily workflow for two reasons. run.mjs has no sphere flag
# and exits non-zero when nothing is produced, which is right for a daily brief
# and wrong for a pulse. And a 30-minute cadence must never be able to wedge
# the daily brief.

on:
  schedule:
    # The window spans two calendar days, so it needs two entries: the evening
    # of the 12th, then all of the 13th. The runner enforces the real window
    # itself and exits cleanly after 23:00 on the 13th, so the trailing slots
    # are no-ops rather than unwanted runs.
    #
    # Actions honours schedules loosely - runs are delayed under load and are
    # sometimes skipped entirely. The runner never assumes even spacing: it
    # sweeps a generous window and dedupes by link hash in the ledger.
    - cron: '*/30 21-23 12 9 *'
      timezone: 'Europe/Stockholm'
    - cron: '*/30 * 13 9 *'
      timezone: 'Europe/Stockholm'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Sweep and list live feeds only. No model calls, no writes.'
        type: boolean
        default: true
      force:
        description: 'Run for real even outside the pulse window.'
        type: boolean
        default: false

concurrency:
  # A delayed run must never overlap its successor. Overlap would double-count
  # circulation and manufacture a pattern out of scheduler jitter rather than
  # out of what the press actually did.
  group: election-pulse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot rebase, and this pushes to the same branch
          # every 30 minutes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Run pulse
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULSE_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PULSE_FORCE: ${{ inputs.force && '1' || '0' }}
        run: npm run pulse

      - name: Publish the episode
        # One MP3 per published entry, uploaded to the same release the nightly
        # run uses. Filenames carry the entry id, so nothing clobbers anything.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp3 >/dev/null 2>&1; then
            gh release view audio >/dev/null 2>&1 \
              || gh release create audio --title "Episodes" --notes "Daily audio briefs."
            gh release upload audio out/*.mp3 --clobber
          else
            echo "No audio this pulse."
          fi

      - name: Commit
        # A dry run writes nothing, so there is nothing to commit and no reason
        # to run git at all.
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "morgonbrief"
          git config user.email "actions@users.noreply.github.com"

          # -A on the directory rather than naming files. The runner exits
          # early outside its window and writes nothing, and naming a file that
          # does not exist yet makes git add fatal with exit 128 - which is
          # exactly how this failed the first time.
          git add -A docs/

          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "val2026 pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

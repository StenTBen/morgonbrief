name: Election pulse (val2026)

# Separate from the daily Morgonbrief workflow on purpose, for two reasons.
#
# run.mjs has no --sphere flag and exits non-zero when nothing is produced —
# correct for a daily brief, wrong for a pulse where an empty run is the
# expected outcome. And if a 30-minute cadence wedges or burns its budget, the
# daily brief must be untouched. One failing sphere must not take down the
# others; that applies to workflows too.

on:
  schedule:
    # Every 30 minutes. Actions honours this loosely: scheduled runs are delayed
    # under platform load and are sometimes skipped entirely. The runner does
    # not assume even spacing — it sweeps a generous window and dedupes by link
    # hash in the ledger.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # A delayed run must never overlap its successor. Overlap would double-count
  # circulation and manufacture a pattern out of scheduler jitter.
  group: election-pulse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # The runner checks cadence.intensiveUntil itself and exits cleanly when
      # the window has closed, so a forgotten cron costs one no-op job rather
      # than running every 30 minutes forever.
      - name: Run pulse
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/sphere-val2026.mjs

      - name: Commit ledger and feed
        run: |
          git config user.name  "morgonbrief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/val-ledger.json docs/val-feed.json
          if git diff --staged --quiet; then
            echo "Nothing changed — a quiet pulse is a correct pulse."
            exit 0
          fi
          git commit -m "val2026 pulse $(date -u +%Y-%m-%dT%H:%MZ)"
          # The daily run or a delayed sibling pulse may have pushed meanwhile.
          git pull --rebase --autostash
          git push

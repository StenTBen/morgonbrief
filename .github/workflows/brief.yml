name: Morgonbrief

on:
  schedule:
    # Local time, pinned. GitHub added IANA timezone support for cron in late
    # March 2026, which removes the summer/winter drift this used to have.
    #
    # One edge worth knowing, since 02:00 sits exactly on it: on the night the
    # clocks go forward, 02:00 Europe/Stockholm does not exist. GitHub documents
    # that a schedule in a skipped hour advances to the next valid time, so that
    # night the brief runs at 03:00 rather than not at all.
    #
    # 02:00 local gives four hours before 06:00. The margin is not generous:
    # the scheduler runs late under load, reportedly anywhere from 15 minutes
    # to over two hours during peak periods.
    - cron: '0 2 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: write # publish the episode, commit the feed

concurrency:
  group: morgonbrief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Two-hour budget plus margin. The old 30 minutes would kill the run
    # mid-way once speech normalization and the Gemini-TTS path are in.
    # Measured on the first full run: about 14 minutes, almost all of it TTS.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot rebase, and the commit step below rebases
          # before pushing. The election pulse that used to push to this branch
          # every 30 minutes is gone, but the rebase is still the right thing:
          # a manual dispatch and the nightly schedule can still overlap.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Self-switching on purpose. `npm ci` needs a package-lock.json, which
      # this repo does not have yet - run the Lockfile workflow once and this
      # step starts using it with no further edit. Until then `npm install`
      # re-resolves the tree every night, which is how fast-xml-parser moved
      # from 4.4.x to 4.5.5 on its own and took four feeds down with it.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Lockfile present - installing exactly what it pins."
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json. Versions will float; run the Lockfile workflow once to stop that."
            npm install --no-audit --no-fund
          fi

      # Runs before anything is spent. Offline, no keys, well under a second -
      # scripts/checks.mjs, which tests the things that otherwise succeed while
      # being wrong: every model role resolving to a model with a price behind
      # it, sphere ids matching between config.json and the sphere files, the
      # search domain lists fitting inside Brave's query ceiling, party
      # abbreviations surviving the query builders. A broken config that reaches
      # the build step burns Opus credit before anyone sees it.
      #
      # It blocks. The night sphere ids or roles change, expect this to fail and
      # the brief not to run until it is updated - which is the right way round,
      # but worth knowing before it happens at 02:00. Silent when green; on a
      # failure it names the case and reprints what the failing code logged.
      - name: Check the wiring
        run: npm test

      - name: Build today's brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          # Without this the router logs "routed to claude-opus-5 but
          # ANTHROPIC_API_KEY is unset" once per role and writes every episode
          # on DeepSeek instead. The run still succeeds, which is exactly why
          # its absence is easy to miss.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run brief

      - name: Publish the episodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp3 >/dev/null 2>&1; then
            gh release view audio >/dev/null 2>&1 \
              || gh release create audio --title "Episodes" --notes "Daily audio briefs."
            gh release upload audio out/*.mp3 --clobber
          else
            echo "No audio produced today, nothing to upload."
          fi

      - name: Commit the feed
        run: |
          git config user.name  "morgonbrief"
          git config user.email "actions@users.noreply.github.com"
          # -A on the directory rather than naming files. unresolved-terms.json
          # does not exist until the first run creates it, and naming a missing
          # file makes git add fatal with exit 128.
          # profile.json is at the repo root, not in docs/. The feedback loop
          # rewrites it, so leaving it out means the level is recalculated and
          # logged every night and then thrown away - a loop that reports
          # success while learning nothing.
          git add -A docs/ profile.json
          # Nothing to commit is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Brief for $(date -u +%Y-%m-%d)"
          # A manual dispatch may have pushed while this was running.
          git pull --rebase --autostash
          git push

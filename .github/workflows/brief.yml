name: Morgonbrief

on:
  schedule:
    # 02:00 UTC = 04:00 in Sweden (summer), 03:00 (winter).
    # Deliberately early: GitHub's scheduler runs late under load, sometimes by
    # half an hour, and the brief has to exist by 06:00.
    - cron: '0 2 * * *'
  workflow_dispatch: {} # run it by hand from the Actions tab

permissions:
  contents: write # publish the episode, commit the feed

concurrency:
  group: morgonbrief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Build today's brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: npm run brief

      - name: Publish the episodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp3 >/dev/null 2>&1; then
            gh release view audio >/dev/null 2>&1 \
              || gh release create audio --title "Episodes" --notes "Daily audio briefs."
            gh release upload audio out/*.mp3 --clobber
          else
            echo "No audio produced today, nothing to upload."
          fi

      - name: Commit the feed
        run: |
          git config user.name  "morgonbrief"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.json docs/seen.json
          # Nothing to commit is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Brief for $(date -u +%Y-%m-%d)"
          git push

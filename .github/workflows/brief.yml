name: Morgonbrief

on:
  schedule:
    # Local time, pinned. GitHub added IANA timezone support for cron in March
    # 2026, which removes the summer/winter drift this used to have.
    #
    # 02:00 local gives four hours before 06:00. The margin is not generous:
    # the scheduler runs late under load, reportedly anywhere from 15 minutes
    # to over two hours during peak periods.
    - cron: '0 2 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: write # publish the episode, commit the feed

concurrency:
  group: morgonbrief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Two-hour budget plus margin. The old 30 minutes would kill the run
    # mid-way once speech normalization and the Gemini-TTS path are in.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone cannot rebase, and the pulse workflow pushes to the
          # same branch every 30 minutes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Build today's brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: npm run brief

      - name: Publish the episodes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp3 >/dev/null 2>&1; then
            gh release view audio >/dev/null 2>&1 \
              || gh release create audio --title "Episodes" --notes "Daily audio briefs."
            gh release upload audio out/*.mp3 --clobber
          else
            echo "No audio produced today, nothing to upload."
          fi

      - name: Commit the feed
        run: |
          git config user.name  "morgonbrief"
          git config user.email "actions@users.noreply.github.com"
          # -A on the directory rather than naming files. unresolved-terms.json
          # does not exist until the first run creates it, and naming a missing
          # file makes git add fatal with exit 128.
          git add -A docs/
          # Nothing to commit is a normal outcome, not a failure.
          git diff --staged --quiet || git commit -m "Brief for $(date -u +%Y-%m-%d)"
          # An election pulse may have pushed while this was running.
          git pull --rebase --autostash
          git push

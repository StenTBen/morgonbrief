<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Morgonbrief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Lifted straight out of icon-512.png rather than invented. The icon has
       always been sage, cream and slate on near-black - three colours that
       already sit together, and an unusual trio for a news app. Two earlier
       attempts failed the two classic dark-mode ways: the olive washed out,
       the mint oversaturated. A palette taken from the product's own mark
       cannot do either, because it was already balanced. */
    --black: #000000;
    --near: #0B0D10;      /* image letterbox, dock */
    --line: #1C2026;
    --line-soft: #14171C;

    --white: #FFFFFF;     /* headlines only */
    --cream: #E9E5DB;     /* body */
    --slate: #8A94A2;     /* meta */
    --slate-dim: #626B78; /* numbers, tertiary */

    --sage: #93BC9E;      /* the lead number, live state, active filter */
    --sage-deep: #7FA88B;
    --sage-dark: #1E2A21;
    --amber: #D9A441;     /* stale feed, single-source flags. Nowhere else. */

    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --gutter: 32px;
    --pad: 20px;
    --dock-h: 128px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--black);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 40rem;
    margin-inline: auto;
    padding: 0 var(--pad) calc(var(--dock-h) + env(safe-area-inset-bottom) + 24px);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ---------- masthead ---------- */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: max(16px, env(safe-area-inset-top)) 0 20px;
  }
  .wordmark { margin: 0; font-size: .85rem; font-weight: 400; letter-spacing: .17em; color: var(--slate); }
  .wordmark b { font-weight: 700; color: var(--cream); }
  .stamp {
    margin: 0; flex: none;
    font-family: var(--mono); font-size: .64rem; letter-spacing: .05em; color: var(--slate-dim);
  }
  .stamp .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--sage); margin-right: 5px; vertical-align: middle;
  }
  .stamp[data-stale="true"] { color: var(--amber); }
  .stamp[data-stale="true"] .dot { background: var(--amber); }

  .lede {
    color: var(--white);
    font-size: 2.1rem; font-weight: 800; line-height: 1.05; letter-spacing: -.033em;
    margin: 0 0 8px;
  }
  .counts {
    font-family: var(--mono); font-size: .63rem; letter-spacing: .09em;
    color: var(--slate-dim); text-transform: uppercase; margin: 0 0 20px;
  }

  /* ---------- filter ---------- */
  /* Five equal columns on one hairline. No pills, no container, no scroll rail -
     they fit by construction, so the row can never run off the right edge. */
  .filters { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .filter {
    flex: 1 1 0; min-width: 0;
    appearance: none; background: none; border: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--slate-dim);
    font-family: var(--sans); font-size: .73rem; font-weight: 500; line-height: 1;
    padding: 12px 2px 11px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 160ms ease, border-color 160ms ease;
  }
  .filter[aria-selected="true"] { color: var(--white); border-bottom-color: var(--sage); }
  .filter[data-empty="true"]:not([aria-selected="true"]) { color: #3B424B; }

  /* ---------- the running index ---------- */
  /* The number column is the whole structure. No cards, no panels: a constant
     vertical rhythm down the left edge, and the hairlines do the separating. */
  .item {
    display: grid;
    grid-template-columns: var(--gutter) minmax(0, 1fr);
    gap: 14px;
    padding: 20px 0;
    border-top: 1px solid var(--line-soft);
  }
  .item:first-of-type { border-top: none; padding-top: 22px; }
  .num {
    font-family: var(--mono); font-size: .8rem; font-weight: 500;
    color: var(--slate-dim); line-height: 1.35; letter-spacing: -.02em;
  }
  .item.lead .num { color: var(--sage); }

  .shot {
    display: block; width: 100%; aspect-ratio: 16 / 9;
    object-fit: cover; background: var(--near);
    border-radius: 3px; margin: 0 0 14px;
  }

  .kicker {
    font-family: var(--mono); font-size: .6rem; font-weight: 500;
    letter-spacing: .17em; color: var(--sage-deep); text-transform: uppercase;
    margin: 0 0 7px;
  }
  .item h2 {
    color: var(--white);
    font-size: 1.55rem; font-weight: 800; line-height: 1.14; letter-spacing: -.025em;
    margin: 0 0 10px;
  }
  .item h3 {
    color: var(--white);
    font-size: 1.04rem; font-weight: 600; line-height: 1.3; letter-spacing: -.012em;
    margin: 0 0 7px;
  }
  .dek { color: var(--cream); font-size: .9rem; line-height: 1.55; margin: 0 0 9px; white-space: pre-line; }
  .item.lead .dek { font-size: .96rem; }
  .clamped .dek { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .clamped .synthes, .clamped details.sources, .clamped .actions { display: none; }
  .synthes { color: var(--sage-deep); font-size: .85rem; line-height: 1.5; margin: 0 0 9px; white-space: pre-line; }

  .meta {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
    color: var(--slate-dim); text-transform: uppercase;
  }
  .meta .flag { color: var(--amber); }

  .more {
    appearance: none; background: none; border: none; padding: 10px 0 0;
    color: var(--sage); font-family: var(--sans); font-size: .78rem; font-weight: 500;
    cursor: pointer;
  }

  details.sources { margin-top: 11px; }
  details.sources summary {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
    color: var(--slate-dim); text-transform: uppercase; cursor: pointer; list-style: none;
  }
  details.sources summary::-webkit-details-marker { display: none; }
  details.sources summary::after { content: ' +'; color: var(--sage-deep); }
  details.sources[open] summary::after { content: ' –'; }
  details.sources ul { list-style: none; padding: 0; margin: 10px 0 0; }
  details.sources li { margin-bottom: 7px; font-size: .81rem; line-height: 1.45; overflow-wrap: anywhere; }
  details.sources a { color: var(--slate); text-decoration-color: var(--line); text-underline-offset: 3px; }

  .actions { display: flex; gap: 14px; margin-top: 13px; }
  .actions button {
    appearance: none; background: none; border: none; padding: 4px 0;
    font-family: var(--mono); font-size: .6rem; letter-spacing: .1em;
    color: var(--slate-dim); text-transform: uppercase; cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  .actions button[data-chosen="true"] { color: var(--sage); border-bottom-color: var(--sage); }

  .notice { color: var(--slate); font-size: .9rem; line-height: 1.6; padding: 22px 0; }

  /* ---------- player ---------- */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: color-mix(in srgb, var(--near) 78%, rgba(0,0,0,.94));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--line);
    padding: 9px var(--pad) calc(9px + env(safe-area-inset-bottom));
  }
  .dock-inner { max-width: 40rem; margin-inline: auto; }
  .dock-row { display: flex; align-items: center; gap: 12px; }
  .dock-text { flex: 1; min-width: 0; }
  .dock-eyebrow {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .18em;
    color: var(--slate-dim); text-transform: uppercase; margin: 0 0 2px;
  }
  .dock-title {
    color: var(--cream); font-size: .87rem; font-weight: 600; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctrl {
    border: none; background: none; color: var(--slate); cursor: pointer;
    padding: 5px; flex: none; display: grid; place-items: center;
  }
  .ctrl:disabled { opacity: .26; cursor: default; }
  .ctrl svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #play {
    width: 44px; height: 44px; flex: none; border-radius: 50%; border: none;
    background: var(--sage); color: #06130A; cursor: pointer;
    display: grid; place-items: center; transition: transform 120ms ease;
  }
  #play:active { transform: scale(.94); }
  #play:disabled { opacity: .28; cursor: default; }
  #play svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .times {
    font-family: var(--mono); font-size: .61rem; color: var(--slate-dim);
    flex: none; font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  .scrub { padding: 9px 0 7px; cursor: pointer; touch-action: none; }
  .scrub-rail { height: 2px; background: var(--line); position: relative; }
  .scrub-fill { height: 100%; background: var(--sage); width: 0; }
  .scrub-knob {
    position: absolute; top: 50%; left: 0; width: 10px; height: 10px; border-radius: 50%;
    background: var(--sage); transform: translate(-50%, -50%); opacity: 0; transition: opacity 140ms ease;
  }
  .scrub.dragging .scrub-knob { opacity: 1; }

  .tracks { display: flex; }
  .track {
    flex: 1 1 0; min-width: 0;
    appearance: none; background: none; border: none;
    border-top: 2px solid var(--line); margin-top: 2px;
    color: var(--slate-dim);
    font-family: var(--sans); font-size: .67rem; font-weight: 500;
    padding: 9px 2px 7px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 150ms ease, border-color 150ms ease;
  }
  .track[aria-current="true"] { color: var(--white); border-top-color: var(--sage); }
  .track:disabled { color: #3B424B; border-top-style: dotted; cursor: default; }

  .pulses { margin-top: 6px; }
  .pulses > summary {
    width: fit-content; list-style: none;
    font-family: var(--mono); font-size: .57rem; letter-spacing: .07em;
    color: var(--slate-dim); text-transform: uppercase; cursor: pointer;
  }
  .pulses > summary::-webkit-details-marker { display: none; }
  .pulse-row { display: flex; gap: 14px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .pulse-row::-webkit-scrollbar { display: none; }
  .pulse-row .track { flex: none; border-top: none; border-bottom: 2px solid transparent; padding: 3px 0; }
  .pulse-row .track[aria-current="true"] { border-bottom-color: var(--sage); }

  @media (hover: hover) {
    .filter:hover, .track:not(:disabled):hover, .actions button:hover { color: var(--cream); }
    .scrub:hover .scrub-knob { opacity: 1; }
  }
  @media (max-width: 360px) {
    :root { --pad: 16px; --gutter: 26px; }
    .lede { font-size: 1.9rem; }
    .item h2 { font-size: 1.4rem; }
    .filter { font-size: .69rem; }
  }
  :focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <h1 class="wordmark"><b>MORGON</b>BRIEF</h1>
    <p class="stamp" id="stamp" hidden><span class="dot"></span><span id="stampText"></span></p>
  </header>

  <h2 class="lede" id="areaHeading">Dagens viktigaste</h2>
  <p class="counts" id="counts">—</p>

  <nav class="filters" id="filters" role="tablist" aria-label="Filtrera efter område"></nav>
  <p class="sr-only" id="filterStatus" role="status" aria-live="polite"></p>

  <main id="app" aria-busy="true"><p class="notice">Hämtar dagens flöde…</p></main>
</div>

<div class="dock" id="dock" role="region" aria-label="Poddspelare">
  <div class="dock-inner">
    <div class="dock-row">
      <div class="dock-text">
        <p class="dock-eyebrow" id="dockEyebrow">Dagens avsnitt</p>
        <p class="dock-title" id="dockTitle">Laddar…</p>
      </div>
      <button class="ctrl" id="back15" aria-label="Backa 15 sekunder" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 7 11l4 4"/><path d="M7 11h7a4 4 0 0 1 0 8h-3"/></svg>
      </button>
      <button id="play" aria-label="Spela" disabled>
        <svg viewBox="0 0 24 24" id="playIcon" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
      </button>
      <button class="ctrl" id="fwd30" aria-label="Hoppa 30 sekunder" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 4 4-4 4"/><path d="M17 11h-7a4 4 0 0 0 0 8h3"/></svg>
      </button>
      <span class="times" id="times">0:00</span>
    </div>

    <div class="scrub" id="scrub" role="slider" aria-label="Spolningsposition" tabindex="0"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="scrub-rail"><div class="scrub-fill" id="scrubFill"></div><span class="scrub-knob" id="scrubKnob"></span></div>
    </div>

    <div class="tracks" id="tracks" role="group" aria-label="Områdespoddar"></div>

    <details class="pulses" id="pulses" hidden>
      <summary id="pulsesLabel">Valpulser</summary>
      <div class="pulse-row" id="pulseTracks" role="group" aria-label="Valpulser"></div>
    </details>
  </div>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBDQ__uXZ6t-cBP2T4DoxUKtrZacARu5YM",
  authDomain: "morgonbrief-78d31.firebaseapp.com",
  projectId: "morgonbrief-78d31",
  storageBucket: "morgonbrief-78d31.firebasestorage.app",
  messagingSenderId: "622096427515",
  appId: "1:622096427515:web:3d834f02d6ea6e0e50835e"
};

const db = getFirestore(initializeApp(firebaseConfig));
signInAnonymously(getAuth()).catch(() => {}); // feedback is best-effort, never blocks reading

const $ = (id) => document.getElementById(id);
const app = $('app'), audio = $('audio'), playBtn = $('play');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const clock = (s) => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
const tap = () => { try { navigator.vibrate?.(8); } catch {} };
const pad2 = (n) => String(n).padStart(2, '0');

/* Valet sits leftmost of the areas for as long as it matters; move it down the
   list after the election. `id` matches sphere.id in the backend, so renaming a
   sphere's label never breaks the filter - only what it is called. */
const AREAS = [
  { id: 'val2026',  label: 'Valet',   heading: 'Sveriges val' },
  { id: 'congress', label: 'Politik', heading: 'Kongressens politik' },
  { id: 'crypto',   label: 'Ekonomi', heading: 'Världens ekonomi' },
  { id: 'world',    label: 'Världen', heading: 'Världens nyheter' }
];
const ALL = { id: 'all', label: 'Allt', heading: 'Dagens viktigaste' };
const areaFor = (id) => (id === 'all' ? ALL : AREAS.find((a) => a.id === id));

/* Votes are remembered on the device. Firestore is write-only by design (the
   rules forbid reading it back), so without this the buttons forget every
   choice the moment the app closes. */
const VOTES = 'morgonbrief.votes';
const loadVotes = () => { try { return JSON.parse(localStorage.getItem(VOTES) ?? '{}'); } catch { return {}; } };
const saveVote = (id, vote) => {
  try {
    const all = loadVotes();
    if (all[id] === vote) delete all[id]; else all[id] = vote; // tapping again clears it
    localStorage.setItem(VOTES, JSON.stringify(all));
    return all[id] ?? null;
  } catch { return vote; }
};

let feedData = null, selected = 'all';
let episodes = [], pulses = [], playing = [], current = -1;

load();

async function load() {
  try {
    const res = await fetch('feed.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    feedData = await res.json();
    renderStamp(feedData);
    buildPlayer(feedData.episodes ?? []);
    buildFilters();
    renderView();
  } catch {
    app.innerHTML = `<p class="notice">Kunde inte hämta flödet, och inget finns sparat offline än. Öppna appen en gång med täckning.</p>`;
  } finally {
    app.setAttribute('aria-busy', 'false');
    measureDock();
  }
}

function renderStamp(data) {
  const built = new Date(data.builtAt ?? NaN);
  if (!isFinite(built.getTime())) return;
  const opts = { timeZone: 'Europe/Stockholm' };
  // Two hours is where a half-hourly pulse has plainly missed several slots.
  // Below that a gap is a quiet stretch and should not look like an alarm.
  const stale = (Date.now() - built.getTime()) / 60000 > 120;
  $('stamp').dataset.stale = String(stale);
  $('stampText').textContent =
    built.toLocaleDateString('sv-SE', { ...opts, day: 'numeric', month: 'short' }).replace('.', '') +
    ' · ' + built.toLocaleTimeString('sv-SE', { ...opts, hour: '2-digit', minute: '2-digit' });
  $('stamp').hidden = false;
}

/* ---------- filter ---------- */

// Deep items inherit their episode's sphere, so a filter catches them too.
const deepItems = () =>
  (feedData?.episodes ?? []).flatMap((e) =>
    (e.items ?? []).map((i) => ({ ...i, sphere: e.sphere, kategori: e.sphereLabel })));

const itemsFor = (id) => {
  const all = [...(feedData?.feed ?? []), ...deepItems()];
  return id === 'all' ? all : all.filter((i) => i.sphere === id);
};

function buildFilters() {
  $('filters').innerHTML = [ALL, ...AREAS].map((a) =>
    `<button class="filter" type="button" role="tab" data-area="${a.id}"
      aria-selected="${a.id === selected}" data-empty="${itemsFor(a.id).length === 0}"
      >${esc(a.label)}</button>`).join('');
  for (const b of $('filters').querySelectorAll('.filter')) {
    b.onclick = () => { tap(); selectArea(b.dataset.area); };
  }
}

function selectArea(id) {
  if (!areaFor(id)) return;
  selected = id;
  for (const b of $('filters').querySelectorAll('.filter')) {
    b.setAttribute('aria-selected', String(b.dataset.area === id));
  }
  renderView();
  // Deliberately does NOT touch the player. Changing what you read should never
  // interrupt what you are listening to.
}

/* ---------- the running index ---------- */

function renderView() {
  const area = areaFor(selected);
  const items = itemsFor(selected);
  const minutes = items.reduce((n, i) => n + (Number(i.readMinutes) || 0), 0);
  const pods = selected === 'all'
    ? episodes.filter((s) => s.ep).length + pulses.length
    : episodes.filter((s) => s.ep && s.area.id === selected).length
      + (selected === 'val2026' ? pulses.length : 0);

  $('areaHeading').textContent = area.heading;
  $('counts').textContent = [
    `${items.length} post${items.length === 1 ? '' : 'er'}`,
    minutes ? `${minutes} min` : '',
    pods ? `${pods} avsnitt` : ''
  ].filter(Boolean).join(' · ') || 'Inget idag';
  $('filterStatus').textContent = `${area.heading}. ${items.length} poster.`;

  app.innerHTML = items.length
    ? items.map((item, i) => row(item, i)).join('')
    : `<p class="notice">Inget under ${esc(area.label)} idag. Tryck Allt för hela flödet.</p>`;

  wireLead();
  wireFeedback(feedData?.date);
}

/* Only the lead carries a picture, and only a real one: item.image is the
   article's own og:image, taken from the source the entry is built on. No stock,
   no generated art - a decorative picture on a news brief is worse than none,
   because it implies a photograph that does not exist. If the fetch failed
   there is no image and the row is plain text, which is the normal case. */
function shot(item) {
  const src = typeof item.image === 'string' ? item.image : '';
  if (!/^https:\/\//.test(src)) return '';
  return `<img class="shot" src="${esc(src)}" alt="" loading="lazy" decoding="async"
    onerror="this.remove()">`;
}

function metaOf(item) {
  const when = item.publishedAt
    ? new Date(item.publishedAt).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Stockholm' })
    : '';
  const meta = [esc(item.leadSource ?? ''), when, item.readMinutes ? `${item.readMinutes} min` : '']
    .filter(Boolean).join(' · ');
  const flags = [
    item.singleSource ? '<span class="flag">en källa</span>' : '',
    item.enriched === false ? '<span class="flag">endast ingress</span>' : ''
  ].filter(Boolean).join(' · ');
  return `<p class="meta">${meta}${meta && flags ? ' · ' : ''}${flags}</p>`;
}

function sourcesOf(item) {
  const list = item.sources ?? item.coverage ?? [];
  return `
    <details class="sources">
      <summary>Källor ${list.length + (item.documentUrl ? 1 : 0)}</summary>
      <ul>
        ${item.documentUrl ? `<li><a href="${esc(item.documentUrl)}" target="_blank" rel="noopener">Primärkällan</a></li>` : ''}
        ${list.map((s) => `<li><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a> — ${esc(s.source)}</li>`).join('')}
      </ul>
    </details>`;
}

function actionsOf(item) {
  const chosen = loadVotes()[item.id] ?? null;
  return `
    <div class="actions">
      <button data-vote="up"     data-chosen="${chosen === 'up'}">Mer</button>
      <button data-vote="down"   data-chosen="${chosen === 'down'}">Mindre</button>
      <button data-vote="deeper" data-chosen="${chosen === 'deeper'}">Fördjupa</button>
    </div>`;
}

function row(item, i) {
  const lead = i === 0;
  return `
    <article class="item${lead ? ' lead clamped' : ''}" ${lead ? 'id="leadItem"' : ''}
             data-id="${esc(item.id)}" data-sphere="${esc(item.sphere ?? '')}">
      <div class="num" aria-hidden="true">${pad2(i + 1)}</div>
      <div>
        ${lead ? shot(item) : ''}
        <p class="kicker">${esc(item.kategori || item.sphere || '')}</p>
        ${lead ? `<h2>${esc(item.rubrik)}</h2>` : `<h3>${esc(item.rubrik)}</h3>`}
        <p class="dek">${esc(item.sammanfattning)}</p>
        ${item.synthes ? `<p class="synthes">${esc(item.synthes)}</p>` : ''}
        ${item.varfor ? `<p class="synthes">${esc(item.varfor)}</p>` : ''}
        ${metaOf(item)}
        ${sourcesOf(item)}
        ${actionsOf(item)}
        ${lead ? `<button class="more" id="leadMore" type="button">Läs hela</button>` : ''}
      </div>
    </article>`;
}

/* The lead expands in place. There is no article page to link to, and a button
   that promised one would be lying about what this app is. */
function wireLead() {
  const more = $('leadMore');
  if (!more) return;
  more.onclick = () => { tap(); $('leadItem').classList.remove('clamped'); more.remove(); };
}

/* ---------- player ---------- */

function buildPlayer(all) {
  const withAudio = all.filter((e) => e.audioUrl);

  // Four fixed slots, one per area, always in the same order. A missing episode
  // keeps its slot - the alternative is a player whose buttons move depending on
  // what the backend managed to produce that night.
  episodes = AREAS.map((a) => ({
    area: a,
    ep: withAudio.find((e) => e.sphere === a.id && e.kind !== 'pulse') ?? null
  }));

  // Election pulses are separate: there can be dozens in a day, and they would
  // otherwise bury the four daily episodes.
  pulses = withAudio.filter((e) => e.kind === 'pulse')
    .sort((a, b) => String(b.sphereLabel).localeCompare(String(a.sphereLabel)));

  $('tracks').innerHTML = episodes.map((slot, i) =>
    `<button class="track" data-list="area" data-i="${i}" ${slot.ep ? '' : 'disabled'}
      aria-current="false">${esc(slot.area.label)}</button>`).join('');

  $('pulses').hidden = pulses.length === 0;
  if (pulses.length) {
    $('pulsesLabel').textContent = `${pulses.length} valpulser`;
    $('pulseTracks').innerHTML = pulses.map((e, i) =>
      `<button class="track" data-list="pulse" data-i="${i}" aria-current="false">${esc(e.sphereLabel)}</button>`).join('');
  }

  for (const b of document.querySelectorAll('.track:not(:disabled)')) {
    b.onclick = () => { tap(); select(b.dataset.list, +b.dataset.i); audio.play(); }; // an explicit tap means play
  }

  const first = episodes.findIndex((s) => s.ep);
  if (first >= 0) { enable(); select('area', first); }
  else if (pulses.length) { enable(); select('pulse', 0); }
  else {
    $('dockEyebrow').textContent = 'Inget avsnitt';
    $('dockTitle').textContent = 'Fyra områdespoddar väntas';
  }
  measureDock();
}

const enable = () => { for (const id of ['play','back15','fwd30']) $(id).disabled = false; };

function select(list, i) {
  const isArea = list === 'area';
  playing = isArea ? episodes : pulses;
  current = i;
  const ep = isArea ? episodes[i]?.ep : pulses[i];
  if (!ep) return;

  audio.src = ep.audioUrl;
  $('dockEyebrow').textContent = isArea ? 'Dagens avsnitt' : 'Valpuls';
  $('dockTitle').textContent = isArea ? episodes[i].area.heading : ep.sphereLabel;
  for (const b of document.querySelectorAll('.track')) {
    b.setAttribute('aria-current', String(b.dataset.list === list && +b.dataset.i === i));
  }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: $('dockTitle').textContent, artist: 'Morgonbrief', album: 'Morgonbrief',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  }
}

// Steps past empty slots, so "next" means the next episode that exists.
function step(delta) {
  if (!playing.length) return;
  const isArea = playing === episodes;
  let i = current + delta;
  while (i >= 0 && i < playing.length) {
    if (!isArea || playing[i].ep) return select(isArea ? 'area' : 'pulse', i);
    i += delta;
  }
}

function measureDock() {
  const h = $('dock').offsetHeight;
  if (h) document.documentElement.style.setProperty('--dock-h', `${h}px`);
}
addEventListener('resize', measureDock);

playBtn.onclick = () => { tap(); audio.paused ? audio.play() : audio.pause(); };
$('back15').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
$('fwd30').onclick  = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };

/* Dragging the bar. Pointer events cover touch and mouse in one path, and
   pointer capture keeps the drag alive when the finger leaves the 2px rail. */
const scrub = $('scrub');
const seekFromEvent = (e) => {
  if (!audio.duration) return;
  const r = scrub.getBoundingClientRect();
  audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * audio.duration;
  paint();
};
scrub.addEventListener('pointerdown', (e) => {
  scrub.setPointerCapture(e.pointerId); scrub.classList.add('dragging'); seekFromEvent(e);
});
scrub.addEventListener('pointermove', (e) => { if (scrub.classList.contains('dragging')) seekFromEvent(e); });
for (const ev of ['pointerup', 'pointercancel']) scrub.addEventListener(ev, () => scrub.classList.remove('dragging'));
scrub.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  if (e.key === 'ArrowRight') { audio.currentTime += 15; e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { audio.currentTime -= 15; e.preventDefault(); }
});

function paint() {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  $('scrubFill').style.width = `${pct}%`;
  $('scrubKnob').style.left = `${pct}%`;
  scrub.setAttribute('aria-valuenow', String(Math.round(pct)));
  $('times').textContent = audio.duration
    ? `${clock(audio.currentTime)} / ${clock(audio.duration)}` : clock(audio.currentTime);
}

const PLAY = '<path d="M7 4l13 8-13 8z"/>';
const PAUSE = '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
audio.onplay  = () => { $('playIcon').innerHTML = PAUSE; playBtn.setAttribute('aria-label','Pausa'); };
audio.onpause = () => { $('playIcon').innerHTML = PLAY;  playBtn.setAttribute('aria-label','Spela'); };
audio.ontimeupdate = paint;
audio.onloadedmetadata = paint;
// Deliberately no auto-play on ended: the next episode is queued, never started.
// Playback is always something Karl chose, not something that happened to him.
audio.onended = () => step(1);

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
  navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 30; });
  navigator.mediaSession.setActionHandler('nexttrack', () => { step(1); audio.play(); }); // explicit tap, so playing is right here
  navigator.mediaSession.setActionHandler('previoustrack', () => { step(-1); audio.play(); });
}

function wireFeedback(date) {
  for (const button of document.querySelectorAll('.actions button')) {
    button.onclick = async () => {
      tap();
      const article = button.closest('article');
      const id = article.dataset.id;
      const now = saveVote(id, button.dataset.vote);
      for (const sib of article.querySelectorAll('.actions button')) {
        sib.dataset.chosen = String(sib.dataset.vote === now);
      }
      if (!now) return; // cleared
      try {
        await addDoc(collection(db, 'feedback'), {
          date, sphere: article.dataset.sphere, itemId: id,
          vote: button.dataset.vote, createdAt: serverTimestamp()
        });
      } catch { /* the local choice stands even if the write fails */ }
    };
  }
}

// Register, then watch for a newer worker. When one is ready we let it take over
// and reload once, so a design change lands on the next open rather than
// whenever the OS happens to kill the app.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const fresh = reg.installing;
      if (!fresh) return;
      fresh.addEventListener('statechange', () => {
        if (fresh.state === 'installed' && navigator.serviceWorker.controller) {
          fresh.postMessage('skip-waiting');
        }
      });
    });
    reg.update().catch(() => {});
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>

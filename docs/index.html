<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B09">
<title>Morgonbrief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Muted olive, in shades rather than one bright accent. The old #4ADE80 was
       a signal colour doing decorative work; olive reads as considered at the
       same contrast and leaves the bright end of the scale free for the one
       thing that should actually shout - a stale feed. */
    --ground: #0A0B09;
    --raised: #131510;
    --sunken: #0E100C;
    --ink: #ECEEE4;
    --muted: #979C88;
    --dim: #666B58;
    --rule: #212418;
    --rule-soft: #191C13;

    --olive: #97A56A;        /* primary accent */
    --olive-lit: #B3C085;    /* hover, emphasis */
    --olive-dim: #5F6B3C;    /* borders, second tier */
    --olive-deep: #323A20;   /* fills */
    --warn: #C0A15C;

    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --dock-h: 138px;
    --pad: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 40rem;
    margin-inline: auto;
    padding: 0 var(--pad) calc(var(--dock-h) + env(safe-area-inset-bottom) + 26px);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: max(16px, env(safe-area-inset-top)) 0 26px;
  }
  .wordmark {
    margin: 0;
    font-size: .95rem;
    font-weight: 400;
    letter-spacing: .13em;
    color: var(--ink);
  }
  .wordmark b { font-weight: 700; letter-spacing: .11em; }
  .dateline {
    display: block;
    margin-top: 4px;
    font-size: .72rem;
    font-weight: 400;
    letter-spacing: .01em;
    color: var(--dim);
  }
  .freshness {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 2px 0 0;
    font-family: var(--mono);
    font-size: .63rem;
    letter-spacing: .04em;
    color: var(--dim);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--olive); flex: none; }
  .freshness[data-stale="true"] { color: var(--warn); }
  .freshness[data-stale="true"] .dot { background: var(--warn); }

  /* ---------- hero ---------- */
  .lede {
    font-size: 2.15rem;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -.028em;
    margin: 0 0 10px;
  }
  .counts {
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .07em;
    color: var(--dim);
    margin: 0 0 22px;
  }

  .hero {
    position: relative;
    background: linear-gradient(158deg, var(--raised) 0%, var(--sunken) 100%);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 20px 19px 18px;
    margin-bottom: 26px;
    overflow: hidden;
  }
  /* One olive hairline down the left edge. The only ornament in the app, and it
     marks the single story that leads. */
  .hero::before {
    content: '';
    position: absolute;
    left: 0; top: 18px; bottom: 18px;
    width: 2px;
    background: linear-gradient(180deg, var(--olive), var(--olive-deep));
  }
  .hero h2 {
    font-size: 1.62rem;
    font-weight: 700;
    line-height: 1.16;
    letter-spacing: -.02em;
    margin: 0 0 10px;
  }
  .hero .dek { font-size: .95rem; margin-bottom: 14px; }
  .hero.clamped .dek {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero.clamped .synthes,
  .hero.clamped details.sources,
  .hero.clamped .actions { display: none; }

  .more {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: transparent;
    border: 1px solid var(--olive-dim);
    color: var(--olive);
    font-family: var(--sans);
    font-size: .76rem;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: 100px;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: .6rem;
    font-weight: 500;
    letter-spacing: .16em;
    color: var(--olive);
    border: 1px solid var(--olive-dim);
    border-radius: 100px;
    padding: 3px 9px;
    margin: 0 0 12px;
    text-transform: uppercase;
  }

  /* ---------- segmented filter ---------- */
  /* Five segments share one fixed container, so they fit by construction rather
     than by luck. No scroll rail running off the right edge, whatever the phone
     width or label length. */
  .segbar {
    position: relative;
    display: flex;
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 100px;
    padding: 3px;
    margin: 0 0 28px;
    isolation: isolate;
  }
  .seg-thumb {
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: 0;
    border-radius: 100px;
    background: var(--olive-deep);
    border: 1px solid var(--olive-dim);
    z-index: -1;
    transition: transform 260ms cubic-bezier(.32, .72, 0, 1), width 260ms cubic-bezier(.32, .72, 0, 1);
  }
  .seg {
    flex: 1 1 0;
    min-width: 0;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--dim);
    font-family: var(--sans);
    font-size: .72rem;
    font-weight: 500;
    line-height: 1;
    padding: 11px 2px;
    border-radius: 100px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 180ms ease;
  }
  .seg[aria-selected="true"] { color: var(--olive-lit); font-weight: 600; }
  .seg[data-empty="true"]:not([aria-selected="true"]) { color: #4A4F40; }

  /* ---------- cards ---------- */
  .card {
    background: var(--raised);
    border: 1px solid var(--rule-soft);
    border-radius: 14px;
    padding: 16px 17px 15px;
    margin-bottom: 10px;
  }
  .card:nth-child(even) { background: var(--sunken); }

  .kicker {
    font-family: var(--mono);
    font-size: .6rem;
    font-weight: 500;
    letter-spacing: .16em;
    color: var(--olive);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  .card h3 {
    font-size: 1.06rem;
    font-weight: 600;
    line-height: 1.28;
    letter-spacing: -.012em;
    margin: 0 0 7px;
  }
  .dek { color: var(--muted); font-size: .89rem; margin: 0 0 9px; white-space: pre-line; }
  .synthes { color: var(--olive-dim); font-size: .84rem; margin: 0 0 9px; white-space: pre-line; }

  .meta {
    font-family: var(--mono);
    font-size: .6rem;
    letter-spacing: .09em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .meta .flag { color: var(--warn); }

  details.sources { margin-top: 11px; }
  details.sources summary {
    font-family: var(--mono);
    font-size: .61rem;
    letter-spacing: .09em;
    color: var(--dim);
    cursor: pointer;
    text-transform: uppercase;
    list-style: none;
  }
  details.sources summary::-webkit-details-marker { display: none; }
  details.sources summary::before { content: '+ '; color: var(--olive-dim); }
  details.sources[open] summary::before { content: '– '; }
  details.sources ul { list-style: none; padding: 0; margin: 9px 0 0; }
  details.sources li { margin-bottom: 6px; font-size: .82rem; overflow-wrap: anywhere; }
  details.sources a { color: var(--muted); text-decoration-color: var(--rule); text-underline-offset: 3px; }

  .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .actions button {
    font-family: var(--mono);
    font-size: .61rem;
    letter-spacing: .05em;
    padding: 6px 11px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
  }
  .actions button[data-chosen="true"] {
    color: var(--ink);
    background: var(--olive-deep);
    border-color: var(--olive-dim);
    font-weight: 500;
  }

  .notice { color: var(--muted); font-size: .9rem; line-height: 1.6; }

  /* ---------- player ---------- */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--raised) 93%, transparent);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--rule);
    padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  }
  .dock-inner { max-width: 40rem; margin-inline: auto; }
  .dock-row { display: flex; align-items: center; gap: 12px; }

  .dock-text { flex: 1; min-width: 0; }
  .dock-eyebrow {
    font-family: var(--mono);
    font-size: .56rem; letter-spacing: .17em;
    color: var(--olive-dim); text-transform: uppercase;
    margin: 0 0 2px;
  }
  .dock-title {
    font-size: .88rem; font-weight: 600; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .ctrl {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; padding: 5px; flex: none;
    display: grid; place-items: center;
  }
  .ctrl:disabled { opacity: .28; cursor: default; }
  .ctrl svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #play {
    width: 46px; height: 46px; flex: none;
    border-radius: 50%; border: none;
    background: var(--olive);
    color: var(--ground);
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform 120ms ease;
  }
  #play:active { transform: scale(.94); }
  #play:disabled { opacity: .3; cursor: default; }
  #play svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }

  .times {
    font-family: var(--mono); font-size: .62rem;
    color: var(--dim); flex: none;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* Generous hit area around a 3px bar, so dragging works with a thumb. */
  .scrub { padding: 9px 0 6px; cursor: pointer; touch-action: none; }
  .scrub-rail { height: 3px; background: var(--rule); border-radius: 3px; position: relative; }
  .scrub-fill { height: 100%; background: var(--olive); border-radius: 3px; width: 0; }
  .scrub-knob {
    position: absolute; top: 50%; left: 0;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--olive-lit);
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity 140ms ease;
  }
  .scrub.dragging .scrub-knob { opacity: 1; }

  .tracks { display: flex; gap: 5px; margin-top: 2px; }
  .track {
    flex: 1 1 0; min-width: 0;
    font-family: var(--sans); font-size: .66rem; font-weight: 500;
    min-height: 29px; padding: 6px 3px;
    border-radius: 100px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
    border: 1px solid var(--rule); background: transparent;
    color: var(--dim); cursor: pointer;
    transition: color 140ms ease, border-color 140ms ease;
  }
  .track[aria-current="true"] { color: var(--olive-lit); border-color: var(--olive-dim); background: rgba(151, 165, 106, .07); }
  .track:disabled { opacity: .32; border-style: dashed; cursor: default; }

  .pulses { margin-top: 7px; }
  .pulses > summary {
    width: fit-content; list-style: none;
    font-family: var(--mono); font-size: .58rem; letter-spacing: .06em;
    color: var(--dim); cursor: pointer;
  }
  .pulses > summary::-webkit-details-marker { display: none; }
  .pulse-row { display: flex; gap: 5px; margin-top: 7px; overflow-x: auto; scrollbar-width: none; }
  .pulse-row::-webkit-scrollbar { display: none; }
  .pulse-row .track { flex: none; padding: 6px 11px; }

  @media (hover: hover) {
    .seg:hover { color: var(--muted); }
    .more:hover { background: rgba(151, 165, 106, .09); color: var(--olive-lit); }
    .track:not(:disabled):hover, .actions button:hover { color: var(--ink); border-color: var(--muted); }
    .scrub:hover .scrub-knob { opacity: 1; }
  }
  @media (max-width: 360px) {
    :root { --pad: 16px; }
    .seg { font-size: .68rem; }
    .lede { font-size: 1.95rem; }
  }

  :focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <h1 class="wordmark"><b>MORGON</b>BRIEF<span class="dateline" id="dateline">—</span></h1>
    <p class="freshness" id="freshness" hidden><span class="dot"></span><span id="freshText"></span></p>
  </header>

  <h2 class="lede" id="areaHeading">Dagens viktigaste</h2>
  <p class="counts" id="counts">—</p>

  <div id="hero"></div>

  <nav class="segbar" id="filters" role="tablist" aria-label="Filtrera efter område">
    <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
  </nav>
  <p class="sr-only" id="filterStatus" role="status" aria-live="polite"></p>

  <main id="app" aria-busy="true"><p class="notice">Hämtar dagens flöde…</p></main>
</div>

<div class="dock" id="dock" role="region" aria-label="Poddspelare">
  <div class="dock-inner">
    <div class="dock-row">
      <div class="dock-text">
        <p class="dock-eyebrow" id="dockEyebrow">Dagens avsnitt</p>
        <p class="dock-title" id="dockTitle">Laddar…</p>
      </div>
      <button class="ctrl" id="back15" aria-label="Backa 15 sekunder" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 7 11l4 4"/><path d="M7 11h7a4 4 0 0 1 0 8h-3"/></svg>
      </button>
      <button id="play" aria-label="Spela" disabled>
        <svg viewBox="0 0 24 24" id="playIcon" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
      </button>
      <button class="ctrl" id="fwd30" aria-label="Hoppa 30 sekunder" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 4 4-4 4"/><path d="M17 11h-7a4 4 0 0 0 0 8h3"/></svg>
      </button>
      <span class="times" id="times">0:00</span>
    </div>

    <div class="scrub" id="scrub" role="slider" aria-label="Spolningsposition" tabindex="0"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="scrub-rail"><div class="scrub-fill" id="scrubFill"></div><span class="scrub-knob" id="scrubKnob"></span></div>
    </div>

    <div class="tracks" id="tracks" role="group" aria-label="Områdespoddar"></div>

    <details class="pulses" id="pulses" hidden>
      <summary id="pulsesLabel">Valpulser</summary>
      <div class="pulse-row" id="pulseTracks" role="group" aria-label="Valpulser"></div>
    </details>
  </div>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBDQ__uXZ6t-cBP2T4DoxUKtrZacARu5YM",
  authDomain: "morgonbrief-78d31.firebaseapp.com",
  projectId: "morgonbrief-78d31",
  storageBucket: "morgonbrief-78d31.firebasestorage.app",
  messagingSenderId: "622096427515",
  appId: "1:622096427515:web:3d834f02d6ea6e0e50835e"
};

const db = getFirestore(initializeApp(firebaseConfig));
signInAnonymously(getAuth()).catch(() => {}); // feedback is best-effort, never blocks reading

const $ = (id) => document.getElementById(id);
const app = $('app'), audio = $('audio'), playBtn = $('play');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const clock = (s) => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';
const tap = () => { try { navigator.vibrate?.(8); } catch {} };

/* Valet sits leftmost of the areas for as long as it matters; move it down the
   list after the election. `id` matches sphere.id in the backend, so renaming a
   sphere's label never breaks the filter - only what it is called. Labels are
   short because five segments share one fixed width. */
const AREAS = [
  { id: 'val2026',  label: 'Valet',   heading: 'Sveriges val' },
  { id: 'congress', label: 'Politik', heading: 'Kongressens politik' },
  { id: 'crypto',   label: 'Ekonomi', heading: 'Världens ekonomi' },
  { id: 'world',    label: 'Världen', heading: 'Världens nyheter' }
];
const ALL = { id: 'all', label: 'Allt', heading: 'Dagens viktigaste' };
const areaFor = (id) => (id === 'all' ? ALL : AREAS.find((a) => a.id === id));

/* Votes are remembered on the device. Firestore is write-only by design (the
   rules forbid reading it back), so without this the buttons forget every
   choice the moment the app closes. */
const VOTES = 'morgonbrief.votes';
const loadVotes = () => { try { return JSON.parse(localStorage.getItem(VOTES) ?? '{}'); } catch { return {}; } };
const saveVote = (id, vote) => {
  try {
    const all = loadVotes();
    if (all[id] === vote) delete all[id]; else all[id] = vote; // tapping again clears it
    localStorage.setItem(VOTES, JSON.stringify(all));
    return all[id] ?? null;
  } catch { return vote; }
};

let feedData = null;
let selected = 'all';
let episodes = [];   // four area slots in AREAS order, some possibly empty
let pulses = [];
let playing = [];
let current = -1;

load();

async function load() {
  try {
    const res = await fetch('feed.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    feedData = await res.json();
    renderDate(feedData);
    buildPlayer(feedData.episodes ?? []);
    buildFilters();
    renderView();
  } catch {
    app.innerHTML = `<p class="notice">Kunde inte hämta flödet, och inget finns sparat offline än. Öppna appen en gång med täckning.</p>`;
  } finally {
    app.setAttribute('aria-busy', 'false');
    measureDock();
  }
}

function renderDate(data) {
  const opts = { timeZone: 'Europe/Stockholm' };
  const d = new Date((data.date ?? '') + 'T00:00:00');
  if (isFinite(d.getTime())) {
    const wd = d.toLocaleDateString('sv-SE', { ...opts, weekday: 'short' }).replace('.', '');
    const rest = d.toLocaleDateString('sv-SE', { ...opts, day: 'numeric', month: 'short', year: 'numeric' });
    $('dateline').textContent = `${wd.charAt(0).toUpperCase()}${wd.slice(1)} ${rest}`;
  } else {
    $('dateline').textContent = 'Datum saknas';
  }

  const built = new Date(data.builtAt ?? NaN);
  if (!isFinite(built.getTime())) return;
  const ageMin = Math.round((Date.now() - built.getTime()) / 60000);
  // Two hours is where a half-hourly pulse has plainly missed several slots.
  // Below that a gap is just a quiet stretch and should not look like an alarm.
  $('freshness').dataset.stale = String(ageMin > 120);
  $('freshText').textContent =
    'Uppd. ' + built.toLocaleTimeString('sv-SE', { ...opts, hour: '2-digit', minute: '2-digit' });
  $('freshness').hidden = false;
}

/* ---------- filter ---------- */

// Deep items inherit their episode's sphere, so a filter catches them too.
const deepItems = () =>
  (feedData?.episodes ?? []).flatMap((e) =>
    (e.items ?? []).map((i) => ({ ...i, sphere: e.sphere, kategori: e.sphereLabel })));

const itemsFor = (id) => {
  const all = [...(feedData?.feed ?? []), ...deepItems()];
  return id === 'all' ? all : all.filter((i) => i.sphere === id);
};

function buildFilters() {
  const bar = $('filters');
  for (const old of bar.querySelectorAll('.seg')) old.remove();

  bar.insertAdjacentHTML('beforeend', [ALL, ...AREAS].map((a) => {
    const empty = itemsFor(a.id).length === 0;
    return `<button class="seg" type="button" role="tab" data-area="${a.id}"
      aria-selected="${a.id === selected}" data-empty="${empty}">${esc(a.label)}</button>`;
  }).join(''));

  for (const b of bar.querySelectorAll('.seg')) {
    b.onclick = () => { tap(); selectArea(b.dataset.area); };
  }
  requestAnimationFrame(moveThumb);
}

// The sliding indicator is measured from the active segment rather than
// computed from an index, so it stays correct when a label renders at a
// different width on a narrower phone.
function moveThumb() {
  const active = $('filters').querySelector('.seg[aria-selected="true"]');
  if (!active) return;
  const thumb = $('segThumb');
  thumb.style.width = `${active.offsetWidth}px`;
  thumb.style.transform = `translateX(${active.offsetLeft - 3}px)`;
}
addEventListener('resize', () => { moveThumb(); measureDock(); });

function selectArea(id) {
  if (!areaFor(id)) return;
  selected = id;
  for (const b of $('filters').querySelectorAll('.seg')) {
    b.setAttribute('aria-selected', String(b.dataset.area === id));
  }
  moveThumb();
  renderView();
  // Deliberately does NOT touch the player. Changing what you read should never
  // interrupt what you are listening to.
}

/* ---------- view ---------- */

function renderView() {
  const area = areaFor(selected);
  const items = itemsFor(selected);
  const minutes = items.reduce((n, i) => n + (Number(i.readMinutes) || 0), 0);
  const pods = selected === 'all'
    ? episodes.filter((s) => s.ep).length + pulses.length
    : episodes.filter((s) => s.ep && s.area.id === selected).length
      + (selected === 'val2026' ? pulses.length : 0);

  $('areaHeading').textContent = area.heading;
  $('counts').textContent = [
    `${items.length} post${items.length === 1 ? '' : 'er'}`,
    minutes ? `${minutes} min` : '',
    pods ? `${pods} avsnitt` : ''
  ].filter(Boolean).join(' · ') || 'Inget idag';
  $('filterStatus').textContent = `${area.heading}. ${items.length} poster.`;

  // The lead story is pulled out of the list, not duplicated into it.
  const [lead, ...rest] = items;
  $('hero').innerHTML = lead ? heroCard(lead) : '';

  app.innerHTML = rest.length
    ? rest.map(card).join('')
    : `<p class="notice">${lead
        ? 'Inget mer under det här området idag.'
        : `Inget under ${esc(area.label)} idag. Tryck "Allt" för hela flödet.`}</p>`;

  wireHero();
  wireFeedback(feedData?.date);
}

const bodyOf = (item) => `
  <p class="dek">${esc(item.sammanfattning)}</p>
  ${item.synthes ? `<p class="synthes">${esc(item.synthes)}</p>` : ''}
  ${item.varfor ? `<p class="synthes">${esc(item.varfor)}</p>` : ''}`;

function metaOf(item) {
  const when = item.publishedAt
    ? new Date(item.publishedAt).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' }).toUpperCase()
    : '';
  const meta = [esc(item.leadSource ?? ''), when, item.readMinutes ? `${item.readMinutes} MIN` : '']
    .filter(Boolean).join(' · ');
  const flags = [
    item.singleSource ? '<span class="flag">EN KÄLLA</span>' : '',
    item.enriched === false ? '<span class="flag">ENDAST INGRESS</span>' : ''
  ].filter(Boolean).join(' · ');
  return `<p class="meta">${meta}${meta && flags ? ' · ' : ''}${flags}</p>`;
}

function sourcesOf(item) {
  const list = item.sources ?? item.coverage ?? [];
  return `
    <details class="sources">
      <summary>Källor (${list.length + (item.documentUrl ? 1 : 0)})</summary>
      <ul>
        ${item.documentUrl ? `<li><a href="${esc(item.documentUrl)}" target="_blank" rel="noopener">Primärkällan</a></li>` : ''}
        ${list.map((s) => `<li><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a> — ${esc(s.source)}</li>`).join('')}
      </ul>
    </details>`;
}

function actionsOf(item) {
  const chosen = loadVotes()[item.id] ?? null;
  return `
    <div class="actions">
      <button data-vote="up"     data-chosen="${chosen === 'up'}">Mer sånt här</button>
      <button data-vote="down"   data-chosen="${chosen === 'down'}">Mindre</button>
      <button data-vote="deeper" data-chosen="${chosen === 'deeper'}">Fördjupa</button>
    </div>`;
}

/* "Läs hela" expands in place. There is no article page to link to, and a button
   that promised one would be lying about what this app is. */
function heroCard(item) {
  return `
    <article class="hero clamped" id="heroCard" data-id="${esc(item.id)}" data-sphere="${esc(item.sphere ?? '')}">
      <span class="tag">${esc(item.kategori || item.sphere || '')}</span>
      <h2>${esc(item.rubrik)}</h2>
      ${bodyOf(item)}
      ${metaOf(item)}
      ${sourcesOf(item)}
      ${actionsOf(item)}
      <button class="more" id="heroMore" type="button">Läs hela <span aria-hidden="true">→</span></button>
    </article>`;
}

function card(item) {
  return `
    <article class="card" data-id="${esc(item.id)}" data-sphere="${esc(item.sphere ?? '')}">
      <p class="kicker">${esc(item.kategori || item.sphere || '')}</p>
      <h3>${esc(item.rubrik)}</h3>
      ${bodyOf(item)}
      ${metaOf(item)}
      ${sourcesOf(item)}
      ${actionsOf(item)}
    </article>`;
}

function wireHero() {
  const more = $('heroMore');
  if (!more) return;
  more.onclick = () => {
    tap();
    $('heroCard').classList.remove('clamped');
    more.remove();
  };
}

/* ---------- player ---------- */

function buildPlayer(all) {
  const withAudio = all.filter((e) => e.audioUrl);

  // Four fixed slots, one per area, always in the same order. A missing episode
  // keeps its slot - the alternative is a player whose buttons move depending on
  // what the backend managed to produce that night.
  episodes = AREAS.map((a) => ({
    area: a,
    ep: withAudio.find((e) => e.sphere === a.id && e.kind !== 'pulse') ?? null
  }));

  // Election pulses are separate: there can be dozens in a day, and they would
  // otherwise bury the four daily episodes.
  pulses = withAudio.filter((e) => e.kind === 'pulse')
    .sort((a, b) => String(b.sphereLabel).localeCompare(String(a.sphereLabel)));

  $('tracks').innerHTML = episodes.map((slot, i) =>
    `<button class="track" data-list="area" data-i="${i}" ${slot.ep ? '' : 'disabled'}
      aria-current="false">${esc(slot.area.label)}</button>`).join('');

  $('pulses').hidden = pulses.length === 0;
  if (pulses.length) {
    $('pulsesLabel').textContent = `+ ${pulses.length} valpulser`;
    $('pulseTracks').innerHTML = pulses.map((e, i) =>
      `<button class="track" data-list="pulse" data-i="${i}" aria-current="false">${esc(e.sphereLabel)}</button>`).join('');
  }

  for (const b of document.querySelectorAll('.track:not(:disabled)')) {
    b.onclick = () => { tap(); select(b.dataset.list, +b.dataset.i); audio.play(); }; // an explicit tap means play
  }

  const first = episodes.findIndex((s) => s.ep);
  if (first >= 0) { enable(); select('area', first); }
  else if (pulses.length) { enable(); select('pulse', 0); }
  else {
    $('dockEyebrow').textContent = 'Inget avsnitt';
    $('dockTitle').textContent = 'Fyra områdespoddar väntas';
  }
  measureDock();
}

const enable = () => { for (const id of ['play','back15','fwd30']) $(id).disabled = false; };

function select(list, i) {
  const isArea = list === 'area';
  playing = isArea ? episodes : pulses;
  current = i;
  const ep = isArea ? episodes[i]?.ep : pulses[i];
  if (!ep) return;

  audio.src = ep.audioUrl;
  $('dockEyebrow').textContent = isArea ? 'Dagens avsnitt' : 'Valpuls';
  $('dockTitle').textContent = isArea ? episodes[i].area.heading : ep.sphereLabel;

  for (const b of document.querySelectorAll('.track')) {
    b.setAttribute('aria-current', String(b.dataset.list === list && +b.dataset.i === i));
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: $('dockTitle').textContent, artist: 'Morgonbrief', album: 'Morgonbrief',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  }
}

// Steps past empty slots, so "next" means the next episode that exists.
function step(delta) {
  if (!playing.length) return;
  const isArea = playing === episodes;
  let i = current + delta;
  while (i >= 0 && i < playing.length) {
    if (!isArea || playing[i].ep) return select(isArea ? 'area' : 'pulse', i);
    i += delta;
  }
}

function measureDock() {
  const h = $('dock').offsetHeight;
  if (h) document.documentElement.style.setProperty('--dock-h', `${h}px`);
}

playBtn.onclick = () => { tap(); audio.paused ? audio.play() : audio.pause(); };
$('back15').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
$('fwd30').onclick  = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };

/* Dragging the bar. Pointer events cover touch and mouse in one path, and
   pointer capture keeps the drag alive when the finger leaves the 3px rail. */
const scrub = $('scrub');
const seekFromEvent = (e) => {
  if (!audio.duration) return;
  const r = scrub.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  audio.currentTime = ratio * audio.duration;
  paint();
};
scrub.addEventListener('pointerdown', (e) => {
  scrub.setPointerCapture(e.pointerId);
  scrub.classList.add('dragging');
  seekFromEvent(e);
});
scrub.addEventListener('pointermove', (e) => { if (scrub.classList.contains('dragging')) seekFromEvent(e); });
for (const ev of ['pointerup', 'pointercancel']) {
  scrub.addEventListener(ev, () => scrub.classList.remove('dragging'));
}
scrub.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  if (e.key === 'ArrowRight') { audio.currentTime += 15; e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { audio.currentTime -= 15; e.preventDefault(); }
});

function paint() {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  $('scrubFill').style.width = `${pct}%`;
  $('scrubKnob').style.left = `${pct}%`;
  scrub.setAttribute('aria-valuenow', String(Math.round(pct)));
  $('times').textContent = audio.duration
    ? `${clock(audio.currentTime)} / ${clock(audio.duration)}`
    : clock(audio.currentTime);
}

const PLAY = '<path d="M7 4l13 8-13 8z"/>';
const PAUSE = '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
audio.onplay  = () => { $('playIcon').innerHTML = PAUSE; playBtn.setAttribute('aria-label','Pausa'); };
audio.onpause = () => { $('playIcon').innerHTML = PLAY;  playBtn.setAttribute('aria-label','Spela'); };
audio.ontimeupdate = paint;
audio.onloadedmetadata = paint;
// Deliberately no auto-play on ended: the next episode is queued, never started.
// Playback is always something Karl chose, not something that happened to him.
audio.onended = () => step(1);

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
  navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 30; });
  navigator.mediaSession.setActionHandler('nexttrack', () => { step(1); audio.play(); }); // explicit tap, so playing is right here
  navigator.mediaSession.setActionHandler('previoustrack', () => { step(-1); audio.play(); });
}

function wireFeedback(date) {
  for (const button of document.querySelectorAll('.actions button')) {
    button.onclick = async () => {
      tap();
      const article = button.closest('article');
      const id = article.dataset.id;
      const now = saveVote(id, button.dataset.vote);
      for (const sib of article.querySelectorAll('.actions button')) {
        sib.dataset.chosen = String(sib.dataset.vote === now);
      }
      if (!now) return; // cleared
      try {
        await addDoc(collection(db, 'feedback'), {
          date, sphere: article.dataset.sphere, itemId: id,
          vote: button.dataset.vote, createdAt: serverTimestamp()
        });
      } catch { /* the local choice stands even if the write fails */ }
    };
  }
}

// Register, then watch for a newer worker. When one is ready we let it take over
// and reload once, so a design change lands on the next open rather than
// whenever the OS happens to kill the app.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const fresh = reg.installing;
      if (!fresh) return;
      fresh.addEventListener('statechange', () => {
        if (fresh.state === 'installed' && navigator.serviceWorker.controller) {
          fresh.postMessage('skip-waiting');
        }
      });
    });
    reg.update().catch(() => {});
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>

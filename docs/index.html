<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<title>Morgonbrief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0B0D0C;
    --raised: #141817;
    --ink: #F2F4F3;
    --muted: #8B948F;
    --dim: #5C645F;
    --rule: #232825;
    --accent: #4ADE80;
    --accent-dim: #2E7D50;
    --warn: #C8A24B;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    /* Measured from the dock after the player is built. The dock grew when the
       track row became permanent, and a fixed guess would either clip the last
       entry or leave a hole under it. */
    --dock-h: 132px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 40rem;
    margin-inline: auto;
    padding: 0 22px calc(var(--dock-h) + env(safe-area-inset-bottom) + 28px);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ---------- masthead ---------- */
  .masthead { padding: max(18px, env(safe-area-inset-top)) 0 0; }
  .wordmark {
    font-family: var(--mono);
    font-size: 1.02rem;
    font-weight: 500;
    letter-spacing: .22em;
    margin: 0;
  }
  .nav {
    font-family: var(--mono);
    font-size: .68rem;
    letter-spacing: .16em;
    color: var(--dim);
    margin: 7px 0 30px;
  }
  .nav span { margin-right: 4px; }

  .dateline {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .13em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .lede {
    font-size: 2.05rem;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -.021em;
    margin: 0 0 20px;
  }
  /* The second line carries the filter. Fixing its height stops the whole page
     from jumping when a short area name replaces a long one. */
  .lede .area { display: block; min-height: 1.12em; }

  .filters {
    display: flex;
    gap: 7px;
    margin: 0 0 28px;
    overflow-x: auto;
    padding-bottom: 3px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }

  .filter {
    flex: none;
    min-height: 38px;
    padding: 8px 13px;
    border: 1px solid var(--rule);
    border-radius: 100px;
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: .66rem;
    letter-spacing: .05em;
    white-space: nowrap;
    cursor: pointer;
    transition: color 130ms ease, background 130ms ease, border-color 130ms ease;
  }
  .filter[aria-pressed="true"] {
    color: var(--accent);
    background: rgba(74, 222, 128, .07);
    border-color: var(--accent-dim);
    font-weight: 500;
  }
  /* An area with nothing in it today still gets a button, so the row does not
     reshuffle between mornings. It just reads as empty. */
  .filter[data-empty="true"] { opacity: .45; }

  .hairline { width: 46px; height: 2px; background: var(--accent); margin-bottom: 32px; }

  /* ---------- entries ---------- */
  .entry {
    padding-bottom: 24px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--rule);
  }

  .kicker {
    font-family: var(--mono);
    font-size: .66rem;
    font-weight: 500;
    letter-spacing: .15em;
    color: var(--accent);
    margin: 0 0 7px;
  }
  .entry h2 {
    font-size: 1.22rem;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -.014em;
    margin: 0 0 8px;
  }
  .dek { color: var(--muted); font-size: .93rem; margin: 0 0 10px; white-space: pre-line; }
  .synthes { color: var(--accent-dim); font-size: .87rem; margin: 0 0 10px; white-space: pre-line; }

  .meta {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .1em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .meta .flag { color: var(--warn); }

  details.sources { margin-top: 12px; }
  details.sources summary {
    font-family: var(--mono);
    font-size: .64rem;
    letter-spacing: .1em;
    color: var(--dim);
    cursor: pointer;
    text-transform: uppercase;
  }
  details.sources ul { list-style: none; padding: 0; margin: 10px 0 0; }
  details.sources li { margin-bottom: 6px; font-size: .84rem; overflow-wrap: anywhere; }
  details.sources a { color: var(--muted); text-decoration-color: var(--rule); text-underline-offset: 3px; }

  .actions { display: flex; gap: 7px; margin-top: 13px; flex-wrap: wrap; }
  .actions button {
    font-family: var(--mono);
    font-size: .63rem;
    letter-spacing: .07em;
    padding: 6px 11px;
    border-radius: 100px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color 130ms ease, background 130ms ease, border-color 130ms ease;
  }
  .actions button[data-chosen="true"] {
    color: var(--ground);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 500;
  }

  /* ---------- docked player ---------- */
  .dock {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--raised) 94%, transparent);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--rule);
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
  }
  .dock-inner {
    max-width: 40rem;
    margin-inline: auto;
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .dock-inner.block { display: block; }
  .dock-art {
    width: 42px; height: 42px; flex: none;
    border-radius: 8px;
    background: var(--accent-dim);
    display: grid; place-items: center;
  }
  .dock-art img { width: 26px; height: 26px; }
  .dock-text { flex: 1; min-width: 0; }
  .dock-title {
    font-size: .86rem; font-weight: 600; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock-sub {
    display: block;
    font-size: .74rem; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .ctrl {
    border: none; background: transparent; color: var(--ink);
    font-family: var(--mono); font-size: .64rem;
    cursor: pointer; padding: 6px; flex: none;
    display: grid; place-items: center;
  }
  .ctrl:disabled { opacity: .3; cursor: default; }
  .ctrl svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #play {
    width: 42px; height: 42px; flex: none;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--ground);
    cursor: pointer;
    display: grid; place-items: center;
  }
  #play:disabled { opacity: .35; cursor: default; }
  #play svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }

  .times { font-family: var(--mono); font-size: .66rem; color: var(--dim); flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .scrub { height: 2px; background: var(--rule); margin-top: 10px; border-radius: 2px; overflow: hidden; }
  .scrub-fill { height: 100%; background: var(--accent); width: 0; }

  .tracks { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tracks::-webkit-scrollbar { display: none; }
  .track {
    flex: none;
    font-family: var(--mono); font-size: .62rem; letter-spacing: .06em;
    min-height: 30px;
    padding: 5px 10px; border-radius: 100px; white-space: nowrap;
    border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer;
  }
  .track[aria-current="true"] { color: var(--accent); border-color: var(--accent-dim); }
  /* A missing episode is shown, not hidden. Four areas means four slots; if the
     backend produced three, the fourth says so instead of quietly vanishing. */
  .track:disabled { opacity: .4; border-style: dashed; cursor: default; }

  .pulses { margin-top: 7px; }
  .pulses > summary {
    width: fit-content;
    font-family: var(--mono); font-size: .6rem; letter-spacing: .05em;
    color: var(--dim); cursor: pointer;
  }

  .notice { color: var(--muted); font-size: .92rem; line-height: 1.6; }
  .section-label {
    font-family: var(--mono); font-size: .66rem; letter-spacing: .15em;
    color: var(--dim); text-transform: uppercase;
    margin: 36px 0 20px; padding-top: 22px; border-top: 1px solid var(--rule);
  }

  @media (hover: hover) {
    .filter:hover, .track:not(:disabled):hover, .actions button:hover {
      color: var(--ink); border-color: var(--muted);
    }
  }
  @media (max-width: 430px) {
    .dock-art { display: none; }
    .dock-inner { gap: 9px; }
    .times { font-size: .6rem; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <h1 class="wordmark">MORGONBRIEF</h1>
    <p class="nav"><span>NYHETER</span>/<span>ANALYS</span>/<span>FÖRDJUPNING</span></p>
    <p class="dateline" id="dateline">—</p>
    <h2 class="lede">Din morgon.<br><span class="area" id="areaHeading">Alla områden.</span></h2>
    <nav class="filters" id="filters" aria-label="Filtrera efter område"></nav>
    <p class="sr-only" id="filterStatus" role="status" aria-live="polite"></p>
    <div class="hairline"></div>
  </header>
  <main id="app" aria-busy="true"><p class="notice">Hämtar dagens flöde…</p></main>
</div>

<div class="dock" id="dock" role="region" aria-label="Poddspelare">
  <div class="dock-inner">
    <div class="dock-art"><img src="icon-192.png" alt=""></div>
    <div class="dock-text">
      <p class="dock-title" id="dockTitle">Laddar…</p>
      <span class="dock-sub" id="dockSub">Områdespoddar</span>
    </div>
    <button class="ctrl" id="back15" aria-label="Backa 15 sekunder" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 7 11l4 4"/><path d="M7 11h7a4 4 0 0 1 0 8h-3"/></svg>
    </button>
    <button id="play" aria-label="Spela" disabled>
      <svg viewBox="0 0 24 24" id="playIcon" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
    </button>
    <button class="ctrl" id="fwd30" aria-label="Hoppa 30 sekunder" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 4 4-4 4"/><path d="M17 11h-7a4 4 0 0 0 0 8h3"/></svg>
    </button>
    <span class="times" id="times">0:00</span>
  </div>

  <div class="dock-inner block">
    <div class="scrub" aria-hidden="true"><div class="scrub-fill" id="scrub"></div></div>
    <div class="tracks" id="tracks" role="group" aria-label="Områdespoddar"></div>
    <details class="pulses" id="pulses" hidden>
      <summary id="pulsesLabel">Valpulser</summary>
      <div class="tracks" id="pulseTracks" role="group" aria-label="Valpulser"></div>
    </details>
  </div>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBDQ__uXZ6t-cBP2T4DoxUKtrZacARu5YM",
  authDomain: "morgonbrief-78d31.firebaseapp.com",
  projectId: "morgonbrief-78d31",
  storageBucket: "morgonbrief-78d31.firebasestorage.app",
  messagingSenderId: "622096427515",
  appId: "1:622096427515:web:3d834f02d6ea6e0e50835e"
};

const db = getFirestore(initializeApp(firebaseConfig));
signInAnonymously(getAuth()).catch(() => {}); // feedback is best-effort, never blocks reading

const $ = (id) => document.getElementById(id);
const app = $('app'), audio = $('audio'), playBtn = $('play');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const clock = (s) => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';

/* The four areas, in reading order. `id` matches sphere.id in the backend, so
   renaming a sphere's label never breaks the filter - only what it is called.
   The heading is the second line of the masthead; "Din morgon." above it never
   changes, because it is about the reader, not about the filter. */
const AREAS = [
  { id: 'congress', label: 'Politik', heading: 'Kongressens politik.' },
  { id: 'crypto',   label: 'Ekonomi', heading: 'Världens ekonomi.' },
  { id: 'world',    label: 'Världen', heading: 'Världens nyheter.' },
  { id: 'val2026',  label: 'Valet',   heading: 'Sveriges val.' }
];
const ALL = { id: 'all', label: 'Din morgon', heading: 'Alla områden.' };
const areaFor = (id) => (id === 'all' ? ALL : AREAS.find((a) => a.id === id));

/* Votes are remembered on the device. Firestore is write-only by design (the
   rules forbid reading it back), so without this the buttons forget every
   choice the moment the app closes. */
const VOTES = 'morgonbrief.votes';
const loadVotes = () => { try { return JSON.parse(localStorage.getItem(VOTES) ?? '{}'); } catch { return {}; } };
const saveVote = (id, vote) => {
  try {
    const all = loadVotes();
    if (all[id] === vote) delete all[id]; else all[id] = vote; // tapping again clears it
    localStorage.setItem(VOTES, JSON.stringify(all));
    return all[id] ?? null;
  } catch { return vote; }
};

let feedData = null;
let selected = 'all';
let episodes = [];   // the four area slots, in AREAS order, some possibly empty
let pulses = [];     // extra election pulses, newest first
let playing = [];    // whichever list the current track came from
let current = -1;

load();

async function load() {
  try {
    const res = await fetch('feed.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    feedData = await res.json();
    renderDate(feedData);
    buildPlayer(feedData.episodes ?? []);
    buildFilters();
    renderFeed();
  } catch {
    app.innerHTML = `<p class="notice">Kunde inte hämta flödet, och inget finns sparat offline än. Öppna appen en gång med täckning.</p>`;
  } finally {
    app.setAttribute('aria-busy', 'false');
    measureDock();
  }
}

function renderDate(data) {
  const d = new Date((data.date ?? '') + 'T00:00:00');
  if (!isFinite(d.getTime())) { $('dateline').textContent = 'DATUM SAKNAS'; return; }
  $('dateline').textContent =
    d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase()
    + ' · ' + d.toLocaleDateString('sv-SE', { weekday: 'long' }).toUpperCase();
}

/* ---------- the feed, and everything the filter touches ---------- */

// Deep items inherit their episode's sphere, so a filter catches them too.
const deepItems = () =>
  (feedData?.episodes ?? []).flatMap((e) =>
    (e.items ?? []).map((i) => ({ ...i, sphere: e.sphere, kategori: e.sphereLabel })));

const countFor = (id) => {
  const all = [...(feedData?.feed ?? []), ...deepItems()];
  return id === 'all' ? all.length : all.filter((i) => i.sphere === id).length;
};

function buildFilters() {
  // The row is fixed: four areas plus the unfiltered view, every day. An area
  // with nothing today is dimmed rather than removed, so the buttons do not
  // move around between mornings.
  $('filters').innerHTML = [ALL, ...AREAS].map((a) => {
    const n = countFor(a.id);
    return `<button class="filter" type="button" data-area="${a.id}"
      aria-pressed="${a.id === selected}" data-empty="${n === 0}"
      >${esc(a.label)}${a.id === 'all' ? '' : ` ${n}`}</button>`;
  }).join('');

  for (const b of $('filters').querySelectorAll('.filter')) {
    b.onclick = () => selectArea(b.dataset.area);
  }
}

function selectArea(id) {
  if (!areaFor(id)) return;
  selected = id;
  $('areaHeading').textContent = areaFor(id).heading;
  for (const b of $('filters').querySelectorAll('.filter')) {
    b.setAttribute('aria-pressed', String(b.dataset.area === id));
  }
  $('filterStatus').textContent = `${areaFor(id).heading} ${countFor(id)} poster.`;
  renderFeed();
  // Deliberately does NOT touch the player. Changing what you read should never
  // interrupt what you are listening to.
}

function renderFeed() {
  const keep = (i) => selected === 'all' || i.sphere === selected;
  const feed = (feedData?.feed ?? []).filter(keep);
  const deep = deepItems().filter(keep);

  const emptyNote = selected === 'all'
    ? 'Inga poster i flödet idag.'
    : `Inget under ${esc(areaFor(selected).label)} idag. Tryck "Din morgon" för allt.`;

  app.innerHTML =
    (feed.length ? feed.map((i) => entry(i)).join('') : `<p class="notice">${emptyNote}</p>`) +
    (deep.length
      ? `<p class="section-label">Fördjupat i dagens avsnitt</p>` + deep.map((i) => entry(i, true)).join('')
      : '');

  wireFeedback(feedData?.date);
}

function entry(item, isDeep = false) {
  const votes = loadVotes();
  const chosen = votes[item.id] ?? null;
  const when = item.publishedAt
    ? new Date(item.publishedAt).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' }).toUpperCase()
    : '';
  const meta = [
    esc(item.leadSource ?? ''),
    when,
    item.readMinutes ? `${item.readMinutes} MIN` : ''
  ].filter(Boolean).join(' · ');

  const flags = [
    item.singleSource ? '<span class="flag">EN KÄLLA</span>' : '',
    (!isDeep && item.enriched === false) ? '<span class="flag">ENDAST INGRESS</span>' : ''
  ].filter(Boolean).join(' · ');

  return `
    <article class="entry" data-id="${esc(item.id)}" data-sphere="${esc(item.sphere ?? '')}">
      <p class="kicker">${esc(item.kategori || item.sphere || '')}</p>
      <h2>${esc(item.rubrik)}</h2>
      <p class="dek">${esc(item.sammanfattning)}</p>
      ${item.synthes ? `<p class="synthes">${esc(item.synthes)}</p>` : ''}
      ${item.varfor ? `<p class="synthes">${esc(item.varfor)}</p>` : ''}
      <p class="meta">${meta}${meta && flags ? ' · ' : ''}${flags}</p>
      <details class="sources">
        <summary>Källor (${(item.sources ?? item.coverage ?? []).length + (item.documentUrl ? 1 : 0)})</summary>
        <ul>
          ${item.documentUrl ? `<li><a href="${esc(item.documentUrl)}" target="_blank" rel="noopener">Primärkällan</a></li>` : ''}
          ${(item.sources ?? item.coverage ?? []).map((s) =>
            `<li><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a> — ${esc(s.source)}</li>`
          ).join('')}
        </ul>
      </details>
      <div class="actions">
        <button data-vote="up"     data-chosen="${chosen === 'up'}">Mer sånt här</button>
        <button data-vote="down"   data-chosen="${chosen === 'down'}">Mindre</button>
        <button data-vote="deeper" data-chosen="${chosen === 'deeper'}">Fördjupa</button>
      </div>
    </article>`;
}

/* ---------- the player ---------- */

function buildPlayer(all) {
  const withAudio = all.filter((e) => e.audioUrl);

  // Four fixed slots, one per area, always in the same order. A missing episode
  // keeps its slot and says it is missing - the alternative is a player whose
  // buttons move depending on what the backend managed to produce.
  episodes = AREAS.map((a) => ({
    area: a,
    ep: withAudio.find((e) => e.sphere === a.id && e.kind !== 'pulse') ?? null
  }));

  // Election pulses are separate: there can be dozens in a day, and they would
  // otherwise bury the four daily episodes.
  pulses = withAudio
    .filter((e) => e.kind === 'pulse')
    .sort((a, b) => String(b.sphereLabel).localeCompare(String(a.sphereLabel)));

  $('tracks').innerHTML = episodes.map((slot, i) => {
    const ok = Boolean(slot.ep);
    return `<button class="track" data-list="area" data-i="${i}" ${ok ? '' : 'disabled'}
      aria-current="false">${esc(slot.area.label)}${ok ? '' : ' — saknas'}</button>`;
  }).join('');

  $('pulses').hidden = pulses.length === 0;
  if (pulses.length) {
    $('pulsesLabel').textContent = `Valpulser (${pulses.length})`;
    $('pulseTracks').innerHTML = pulses.map((e, i) =>
      `<button class="track" data-list="pulse" data-i="${i}" aria-current="false">${esc(e.sphereLabel)}</button>`
    ).join('');
  }

  for (const b of document.querySelectorAll('.track:not(:disabled)')) {
    b.onclick = () => { select(b.dataset.list, +b.dataset.i); audio.play(); }; // an explicit tap means play
  }

  const first = episodes.findIndex((s) => s.ep);
  if (first >= 0) {
    for (const id of ['play','back15','fwd30']) $(id).disabled = false;
    select('area', first);
  } else if (pulses.length) {
    for (const id of ['play','back15','fwd30']) $(id).disabled = false;
    select('pulse', 0);
  } else {
    $('dockTitle').textContent = 'Inget avsnitt idag';
    $('dockSub').textContent = 'Fyra områdespoddar väntas';
  }
  measureDock();
}

function select(list, i) {
  const isArea = list === 'area';
  playing = isArea ? episodes : pulses;
  current = i;

  const ep = isArea ? episodes[i].ep : pulses[i];
  if (!ep) return;

  audio.src = ep.audioUrl;
  $('dockTitle').textContent = isArea ? episodes[i].area.label : ep.sphereLabel;
  $('dockSub').textContent = ep.itemCount
    ? `${ep.itemCount} fördjupat ämne${ep.itemCount === 1 ? '' : 'n'}`
    : (isArea ? 'Dagens avsnitt' : 'Valpuls');

  for (const b of document.querySelectorAll('.track')) {
    b.setAttribute('aria-current', String(b.dataset.list === list && +b.dataset.i === i));
  }

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: $('dockTitle').textContent, artist: 'Morgonbrief', album: 'Morgonbrief',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  }
}

// Advances past empty slots so "next" means the next episode that exists.
function step(delta) {
  if (!playing.length) return;
  const isArea = playing === episodes;
  let i = current + delta;
  while (i >= 0 && i < playing.length) {
    if (!isArea || playing[i].ep) return select(isArea ? 'area' : 'pulse', i);
    i += delta;
  }
}

function measureDock() {
  const h = $('dock').offsetHeight;
  if (h) document.documentElement.style.setProperty('--dock-h', `${h}px`);
}
addEventListener('resize', measureDock);

playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
$('back15').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
$('fwd30').onclick  = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };

const PLAY = '<path d="M7 4l13 8-13 8z"/>';
const PAUSE = '<path d="M8 5h3v14H8zM13 5h3v14h-3z"/>';
audio.onplay  = () => { $('playIcon').innerHTML = PAUSE; playBtn.setAttribute('aria-label','Pausa'); };
audio.onpause = () => { $('playIcon').innerHTML = PLAY;  playBtn.setAttribute('aria-label','Spela'); };
audio.ontimeupdate = () => {
  $('times').textContent = audio.duration ? `${clock(audio.currentTime)} / ${clock(audio.duration)}` : clock(audio.currentTime);
  $('scrub').style.width = audio.duration ? `${(audio.currentTime / audio.duration) * 100}%` : '0';
};
// Deliberately no auto-play on ended: the next episode is queued, never started.
// Playback is always something Karl chose, not something that happened to him.
audio.onended = () => step(1);

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
  navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 30; });
  navigator.mediaSession.setActionHandler('nexttrack', () => { step(1); audio.play(); }); // explicit tap, so playing is right here
  navigator.mediaSession.setActionHandler('previoustrack', () => { step(-1); audio.play(); });
}

function wireFeedback(date) {
  for (const button of document.querySelectorAll('.actions button')) {
    button.onclick = async () => {
      const article = button.closest('.entry');
      const id = article.dataset.id;
      const now = saveVote(id, button.dataset.vote);
      for (const sib of article.querySelectorAll('.actions button')) {
        sib.dataset.chosen = String(sib.dataset.vote === now);
      }
      if (!now) return; // cleared
      try {
        await addDoc(collection(db, 'feedback'), {
          date, sphere: article.dataset.sphere, itemId: id,
          vote: button.dataset.vote, createdAt: serverTimestamp()
        });
      } catch { /* the local choice stands even if the write fails */ }
    };
  }
}

// Register, then watch for a newer worker. When one is ready we let it take
// over and reload once, so a design change lands on the next open rather than
// whenever the OS happens to kill the app.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    reg.addEventListener('updatefound', () => {
      const fresh = reg.installing;
      if (!fresh) return;
      fresh.addEventListener('statechange', () => {
        if (fresh.state === 'installed' && navigator.serviceWorker.controller) {
          fresh.postMessage('skip-waiting');
        }
      });
    });
    reg.update().catch(() => {});
  }).catch(() => {});

  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>

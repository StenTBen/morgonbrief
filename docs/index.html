<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1F26">
<title>Morgonbrief</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #1A1F26;
    --raised: #232A33;
    --ink: #E9E5DB;
    --muted: #8A94A2;
    --rule: #333C47;
    --corroborated: #7FA88B;
    --single: #C8A24B;
    --serif: 'Newsreader', Georgia, serif;
    --ui: ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: max(16px, env(safe-area-inset-top)) 20px 64px;
    max-width: 44rem;
    margin-inline: auto;
  }

  h1 {
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--muted);
    margin: 0 0 28px;
  }

  /* --- the player is the hero: it is what 06:00 in a car needs --- */
  .episode { margin-bottom: 44px; }

  .episode-date {
    font-size: 2.4rem;
    line-height: 1.1;
    font-weight: 300;
    margin: 0 0 4px;
    font-variant-numeric: lining-nums;
  }

  .episode-meta { color: var(--muted); font-size: 0.95rem; margin-bottom: 22px; }

  .transport { display: flex; align-items: center; gap: 16px; }

  #play {
    width: 78px; height: 78px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--raised);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 1.5rem;
    cursor: pointer;
    flex: none;
    transition: background 140ms ease, border-color 140ms ease;
  }
  #play:hover { border-color: var(--muted); }
  #play[data-state="playing"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #play:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--corroborated); outline-offset: 3px; }

  .transport-side { font-family: var(--ui); font-size: 0.82rem; color: var(--muted); }
  .transport-side a { color: var(--muted); }
  #elapsed { font-variant-numeric: tabular-nums; display: block; margin-bottom: 6px; }

  /* --- entries: the left rule carries provenance, it is not decoration --- */
  .entry {
    border-left: 2px solid var(--corroborated);
    padding-left: 18px;
    margin-bottom: 40px;
  }
  .entry[data-single="true"] { border-left-color: var(--single); }

  .entry h2 { font-size: 1.4rem; font-weight: 600; line-height: 1.25; margin: 0 0 10px; }
  .entry p { margin: 0 0 12px; }
  .why { color: var(--muted); font-style: italic; }
  .status { font-family: var(--ui); font-size: 0.8rem; color: var(--muted); }

  .provenance {
    font-family: var(--ui);
    font-size: 0.78rem;
    color: var(--single);
    margin-bottom: 10px;
  }
  .entry[data-single="false"] .provenance { display: none; }

  .sources { font-family: var(--ui); font-size: 0.8rem; margin: 14px 0 0; padding: 0; list-style: none; }
  .sources li { margin-bottom: 5px; }
  .sources a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .sources .src { color: var(--muted); }

  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .actions button {
    font-family: var(--ui);
    font-size: 0.82rem;
    padding: 7px 13px;
    border-radius: 3px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .actions button:hover { color: var(--ink); border-color: var(--muted); }
  .actions button[data-chosen="true"] { color: var(--ground); background: var(--ink); border-color: var(--ink); }

  .notice { color: var(--muted); font-family: var(--ui); font-size: 0.9rem; line-height: 1.6; }
  .notice button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--rule); padding: 8px 14px; border-radius: 3px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<h1>Morgonbrief</h1>
<main id="app"><p class="notice">Hämtar dagens avsnitt…</p></main>
<audio id="audio" preload="none"></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, query, orderBy, limit, getDocs, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBDQ__uXZ6t-cBP2T4DoxUKtrZacARu5YM",
  authDomain: "morgonbrief-78d31.firebaseapp.com",
  projectId: "morgonbrief-78d31",
  storageBucket: "morgonbrief-78d31.firebasestorage.app",
  messagingSenderId: "622096427515",
  appId: "1:622096427515:web:3d834f02d6ea6e0e50835e"
};

const db = getFirestore(initializeApp(firebaseConfig));
const auth = getAuth();
const app = document.getElementById('app');
const audio = document.getElementById('audio');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clock = (s) => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '–:––';

// The app signs itself in silently. No login screen: at 06:00 in a car a
// Google prompt is the wrong product. The anonymous session is what keeps
// Firestore closed to anyone who has not loaded this page.
onAuthStateChanged(auth, (user) => {
  if (user) load();
  else signInAnonymously(auth).catch((e) => {
    app.innerHTML = `<p class="notice">Kunde inte ansluta: ${esc(e.code || e.message)}.</p>`;
  });
});

async function load() {
  try {
    const snap = await getDocs(query(collection(db, 'briefs'), orderBy('date', 'desc'), limit(1)));
    if (snap.empty) {
      app.innerHTML = `<p class="notice">Inget avsnitt har byggts än. Kör jobbet från Actions-fliken för att skapa det första.</p>`;
      return;
    }
    render(snap.docs[0].data());
  } catch (e) {
    app.innerHTML = `<p class="notice">Kunde inte läsa dagens avsnitt: ${esc(e.code || e.message)}.</p>`;
  }
}

function render(brief) {
  const när = new Date(brief.date + 'T00:00:00')
    .toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });

  const antal = brief.itemCount === 0
    ? 'Inget ämne klarade tröskeln idag'
    : `${brief.itemCount} ${brief.itemCount === 1 ? 'ämne' : 'ämnen'} ur kongressen`;

  app.innerHTML = `
    <section class="episode">
      <p class="episode-date">${esc(när)}</p>
      <p class="episode-meta">${esc(antal)}</p>
      <div class="transport">
        <button id="play" data-state="paused" aria-label="Spela avsnittet">▶</button>
        <div class="transport-side">
          <span id="elapsed">–:–– / –:––</span>
          <a href="${esc(brief.audioUrl)}" download>Ladda ner för bilen</a>
        </div>
      </div>
    </section>
    ${(brief.items ?? []).map(entry).join('')}
  `;

  audio.src = brief.audioUrl;
  wireTransport(brief);
  wireFeedback(brief);
}

function entry(item) {
  return `
    <article class="entry" data-single="${!!item.singleSource}" data-id="${esc(item.id)}">
      <h2>${esc(item.rubrik)}</h2>
      <p class="provenance">Bara en källa har rapporterat det här.</p>
      <p>${esc(item.sammanfattning)}</p>
      <p class="why">${esc(item.varfor)}</p>
      <p class="status">${esc(item.status)}</p>
      <ul class="sources">
        <li><a href="${esc(item.documentUrl)}" target="_blank" rel="noopener">Lagtexten på congress.gov</a></li>
        ${(item.coverage ?? []).map((c) =>
          `<li><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="src">${esc(c.source)}</span></li>`
        ).join('')}
      </ul>
      <div class="actions">
        <button data-vote="up">Mer sånt här</button>
        <button data-vote="down">Mindre sånt här</button>
        <button data-vote="deeper">Fördjupa imorgon</button>
      </div>
    </article>`;
}

function wireTransport(brief) {
  const play = document.getElementById('play');
  const elapsed = document.getElementById('elapsed');

  play.onclick = () => audio.paused ? audio.play() : audio.pause();
  audio.onplay = () => { play.dataset.state = 'playing'; play.textContent = '❚❚'; play.setAttribute('aria-label', 'Pausa'); };
  audio.onpause = () => { play.dataset.state = 'paused'; play.textContent = '▶'; play.setAttribute('aria-label', 'Spela avsnittet'); };
  audio.ontimeupdate = () => { elapsed.textContent = `${clock(audio.currentTime)} / ${clock(audio.duration)}`; };

  // Lock screen and steering wheel controls.
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `Morgonbrief ${brief.date}`,
      artist: 'Kongressen',
      album: 'Morgonbrief'
    });
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
    navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 30; });
  }
}

function wireFeedback(brief) {
  for (const button of document.querySelectorAll('.actions button')) {
    button.onclick = async () => {
      const article = button.closest('.entry');
      for (const sibling of article.querySelectorAll('button')) sibling.dataset.chosen = 'false';
      button.dataset.chosen = 'true';
      try {
        await addDoc(collection(db, 'feedback'), {
          date: brief.date,
          sphere: brief.sphere,
          itemId: article.dataset.id,
          vote: button.dataset.vote,
          createdAt: serverTimestamp()
        });
      } catch {
        button.dataset.chosen = 'false';
        button.textContent = 'Kunde inte sparas';
      }
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1F26">
<title>Morgonbrief</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #1A1F26;
    --raised: #232A33;
    --ink: #E9E5DB;
    --muted: #8A94A2;
    --rule: #333C47;
    --corroborated: #7FA88B;
    --single: #C8A24B;
    --serif: 'Newsreader', Georgia, serif;
    --ui: ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 44rem; margin-inline: auto; padding: 0 20px 72px; }

  /* ---- pinned player: the one thing that must be reachable at 06:00 ---- */
  .dock {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: max(10px, env(safe-area-inset-top)) 20px 12px;
  }
  .dock-inner { max-width: 44rem; margin-inline: auto; display: flex; align-items: center; gap: 14px; }

  #play {
    width: 56px; height: 56px; flex: none;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--raised);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 1.15rem;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }
  #play[data-state="playing"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  #play:disabled { opacity: .4; cursor: default; }

  .dock-text { min-width: 0; flex: 1; }
  .dock-title {
    font-size: 1rem; margin: 0 0 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dock-sub { font-family: var(--ui); font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .scrub { width: 100%; height: 2px; background: var(--rule); margin-top: 10px; }
  .scrub-fill { height: 100%; background: var(--corroborated); width: 0; }

  .tracks { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .track {
    font-family: var(--ui); font-size: .74rem;
    padding: 4px 10px; border-radius: 3px;
    border: 1px solid var(--rule); background: transparent; color: var(--muted);
    cursor: pointer;
  }
  .track[aria-current="true"] { color: var(--ground); background: var(--ink); border-color: var(--ink); }

  /* ---- feed ---- */
  h1 { font-size: 1.05rem; font-weight: 400; color: var(--muted); margin: 26px 0 20px; }

  .entry { border-left: 2px solid var(--corroborated); padding-left: 18px; margin-bottom: 38px; }
  .entry[data-single="true"] { border-left-color: var(--single); }

  .entry-sphere { font-family: var(--ui); font-size: .72rem; color: var(--muted); margin: 0 0 5px; }
  .entry h2 { font-size: 1.32rem; font-weight: 600; line-height: 1.25; margin: 0 0 9px; }
  .entry p { margin: 0 0 11px; }
  .synthes { color: var(--corroborated); font-style: italic; }
  .entry[data-single="true"] .provenance { display: block; }
  .provenance { display: none; font-family: var(--ui); font-size: .76rem; color: var(--single); margin-bottom: 9px; }

  .sources { font-family: var(--ui); font-size: .79rem; margin: 12px 0 0; padding: 0; list-style: none; }
  .sources li { margin-bottom: 5px; }
  .sources a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .sources .src { color: var(--muted); }

  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .actions button {
    font-family: var(--ui); font-size: .8rem;
    padding: 6px 12px; border-radius: 3px;
    border: 1px solid var(--rule); background: transparent; color: var(--muted); cursor: pointer;
  }
  .actions button[data-chosen="true"] { color: var(--ground); background: var(--ink); border-color: var(--ink); }

  .notice { color: var(--muted); font-family: var(--ui); font-size: .9rem; line-height: 1.6; }
  .deep { margin: 34px 0 8px; font-family: var(--ui); font-size: .78rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 18px; }

  :focus-visible { outline: 2px solid var(--corroborated); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="dock">
  <div class="dock-inner">
    <button id="play" data-state="paused" aria-label="Spela" disabled>&#9654;</button>
    <div class="dock-text">
      <p class="dock-title" id="dockTitle">Laddar…</p>
      <span class="dock-sub" id="dockSub">–:–– / –:––</span>
    </div>
  </div>
  <div class="dock-inner"><div class="scrub"><div class="scrub-fill" id="scrub"></div></div></div>
  <div class="dock-inner"><div class="tracks" id="tracks"></div></div>
</div>

<div class="wrap">
  <h1 id="heading">Morgonbrief</h1>
  <main id="app"><p class="notice">Hämtar dagens flöde…</p></main>
</div>

<audio id="audio" preload="none"></audio>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBDQ__uXZ6t-cBP2T4DoxUKtrZacARu5YM",
  authDomain: "morgonbrief-78d31.firebaseapp.com",
  projectId: "morgonbrief-78d31",
  storageBucket: "morgonbrief-78d31.firebasestorage.app",
  messagingSenderId: "622096427515",
  appId: "1:622096427515:web:3d834f02d6ea6e0e50835e"
};

// Firestore is only used to record feedback now - the brief itself is a static
// file on the same origin, which is what makes it work with no signal.
const db = getFirestore(initializeApp(firebaseConfig));
signInAnonymously(getAuth()).catch(() => {}); // feedback is best-effort, never blocks reading

const app = document.getElementById('app');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const dockTitle = document.getElementById('dockTitle');
const dockSub = document.getElementById('dockSub');
const scrub = document.getElementById('scrub');
const tracksEl = document.getElementById('tracks');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const clock = (s) => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '–:––';

let episodes = [];
let current = 0;

load();

async function load() {
  try {
    // Network first so a fresh morning wins; the service worker serves the last
    // good copy when there is no signal.
    const res = await fetch('feed.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(String(res.status));
    render(await res.json());
  } catch {
    app.innerHTML = `<p class="notice">Kunde inte hämta flödet, och inget finns sparat offline än. Öppna appen en gång med täckning.</p>`;
  }
}

function render(data) {
  const när = new Date(data.date + 'T00:00:00')
    .toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('heading').textContent = när.charAt(0).toUpperCase() + när.slice(1);

  episodes = (data.episodes ?? []).filter((e) => e.audioUrl);
  buildPlaylist();

  const feed = data.feed ?? [];
  if (!feed.length) {
    app.innerHTML = `<p class="notice">Inga poster i flödet idag.</p>`;
    return;
  }
  app.innerHTML = feed.map(entry).join('') + deepSection(data.episodes ?? []);
  wireFeedback(data.date);
}

function entry(item) {
  const källor = item.sourceCount === 1 ? '1 källa' : `${item.sourceCount} källor`;
  return `
    <article class="entry" data-single="${!!item.singleSource}" data-id="${esc(item.id)}" data-sphere="${esc(item.sphere)}">
      <p class="entry-sphere">${esc(item.sphere)} &middot; ${esc(källor)}${item.enriched ? '' : ' &middot; endast ingresser'}</p>
      <h2>${esc(item.rubrik)}</h2>
      <p class="provenance">Bara en källa har rapporterat det här.</p>
      <p>${esc(item.sammanfattning)}</p>
      ${item.synthes ? `<p class="synthes">${esc(item.synthes)}</p>` : ''}
      <ul class="sources">
        ${(item.sources ?? []).map((s) =>
          `<li><a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="src">${esc(s.source)}</span></li>`
        ).join('')}
      </ul>
      <div class="actions">
        <button data-vote="up">Mer sånt här</button>
        <button data-vote="down">Mindre sånt här</button>
        <button data-vote="deeper">Fördjupa imorgon</button>
      </div>
    </article>`;
}

function deepSection(eps) {
  const withItems = eps.filter((e) => (e.items ?? []).length);
  if (!withItems.length) return `<p class="deep">Inget ämne klarade tröskeln för fördjupning idag.</p>`;
  return `<p class="deep">Fördjupat i dagens avsnitt</p>` + withItems.flatMap((e) =>
    e.items.map((item) => `
      <article class="entry" data-single="${!!item.singleSource}" data-id="${esc(item.id)}" data-sphere="${esc(e.sphere)}">
        <p class="entry-sphere">${esc(e.sphereLabel)}</p>
        <h2>${esc(item.rubrik)}</h2>
        <p class="provenance">Bara en källa har rapporterat det här.</p>
        <p>${esc(item.sammanfattning)}</p>
        <p class="synthes">${esc(item.varfor)}</p>
        <ul class="sources">
          <li><a href="${esc(item.documentUrl)}" target="_blank" rel="noopener">Primärkällan</a></li>
          ${(item.coverage ?? []).map((c) =>
            `<li><a href="${esc(c.link)}" target="_blank" rel="noopener">${esc(c.title)}</a> <span class="src">${esc(c.source)}</span></li>`
          ).join('')}
        </ul>
      </article>`)
  ).join('');
}

// ---- playlist: today's episodes, pinned, always current ----

function buildPlaylist() {
  if (!episodes.length) {
    dockTitle.textContent = 'Inget avsnitt idag';
    tracksEl.innerHTML = '';
    return;
  }
  tracksEl.innerHTML = episodes.length > 1
    ? episodes.map((e, i) => `<button class="track" data-i="${i}" aria-current="${i === 0}">${esc(e.sphereLabel)}</button>`).join('')
    : '';
  for (const b of tracksEl.querySelectorAll('.track')) {
    b.onclick = () => { select(Number(b.dataset.i)); audio.play(); };
  }
  playBtn.disabled = false;
  select(0);
}

function select(i) {
  current = i;
  const ep = episodes[i];
  audio.src = ep.audioUrl;
  dockTitle.textContent = `${ep.sphereLabel} — ${ep.itemCount || 'inget'} ${ep.itemCount === 1 ? 'ämne' : 'ämnen'}`;
  for (const b of tracksEl.querySelectorAll('.track')) b.setAttribute('aria-current', String(Number(b.dataset.i) === i));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: ep.sphereLabel, artist: 'Morgonbrief', album: 'Morgonbrief',
      artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
    });
  }
}

playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay = () => { playBtn.dataset.state = 'playing'; playBtn.innerHTML = '&#10074;&#10074;'; playBtn.setAttribute('aria-label','Pausa'); };
audio.onpause = () => { playBtn.dataset.state = 'paused'; playBtn.innerHTML = '&#9654;'; playBtn.setAttribute('aria-label','Spela'); };
audio.ontimeupdate = () => {
  dockSub.textContent = `${clock(audio.currentTime)} / ${clock(audio.duration)}`;
  scrub.style.width = audio.duration ? `${(audio.currentTime / audio.duration) * 100}%` : '0';
};
// Auto-advance through the playlist, so the drive keeps playing without a tap.
audio.onended = () => { if (current + 1 < episodes.length) { select(current + 1); audio.play(); } };

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime -= 15; });
  navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime += 30; });
  navigator.mediaSession.setActionHandler('nexttrack', () => { if (current + 1 < episodes.length) { select(current + 1); audio.play(); } });
  navigator.mediaSession.setActionHandler('previoustrack', () => { if (current > 0) { select(current - 1); audio.play(); } });
}

function wireFeedback(date) {
  for (const button of document.querySelectorAll('.actions button')) {
    button.onclick = async () => {
      const article = button.closest('.entry');
      for (const sib of article.querySelectorAll('button')) sib.dataset.chosen = 'false';
      button.dataset.chosen = 'true';
      try {
        await addDoc(collection(db, 'feedback'), {
          date, sphere: article.dataset.sphere, itemId: article.dataset.id,
          vote: button.dataset.vote, createdAt: serverTimestamp()
        });
      } catch {
        button.dataset.chosen = 'false';
        button.textContent = 'Kunde inte sparas';
      }
    };
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
